<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易道 · YiDao — 命语 API 全模块</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#08080e;--sf:#111119;--s2:#1a1a25;--s3:#242435;
--ac:#c9a24d;--ad:#8b6914;--ag:rgba(201,162,77,.15);
--t:#e8e0d0;--m:#6e6760;--r:#b84038;--g:#4a9e6e;--b:#4a80b4;
--bd:#2a2a3a;
--f1:'Noto Serif SC','Songti SC',serif;
--f2:'Noto Sans SC','PingFang SC',sans-serif;
--f3:'Cormorant Garamond',serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--f2);background:var(--bg);color:var(--t);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.03}
.container{max-width:1000px;margin:0 auto;padding:0 20px}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 20px;transition:background .4s}
.nav.scrolled{background:rgba(8,8,14,.92);backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--bd)}
.nav-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.nav-logo{font-family:var(--f1);font-size:1.3rem;font-weight:900;color:var(--ac);text-decoration:none;letter-spacing:.08em}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;text-align:center}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(201,162,77,.06),transparent 50%),radial-gradient(ellipse at 70% 30%,rgba(184,64,56,.04),transparent 50%)}
.hero-c{position:relative;z-index:2;padding-top:56px}
.hero-s{font-size:5rem;color:var(--ac);text-shadow:0 0 60px var(--ag);animation:pls 4s ease-in-out infinite;display:block;margin-bottom:20px}
@keyframes pls{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
.hero h1{font-family:var(--f1);font-size:clamp(2.2rem,7vw,4rem);font-weight:900;letter-spacing:.15em;margin-bottom:12px;opacity:0;animation:fu 1s .3s forwards}
.hero-sub{font-family:var(--f3);font-size:clamp(.85rem,2vw,1rem);color:var(--ad);letter-spacing:.2em;margin-bottom:10px;opacity:0;animation:fu 1s .5s forwards}
.hero p{color:var(--m);margin-bottom:40px;opacity:0;animation:fu 1s .7s forwards;font-size:.9rem}
.hero-cta{display:inline-block;padding:12px 40px;border:1px solid var(--ac);color:var(--ac);text-decoration:none;font-family:var(--f1);letter-spacing:.12em;transition:background .3s,color .3s;opacity:0;animation:fu 1s .9s forwards}
.hero-cta:hover{background:var(--ac);color:var(--bg)}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.sec{padding:72px 0}
.sec-t{font-family:var(--f1);font-size:clamp(1.4rem,3.5vw,2rem);font-weight:700;text-align:center;margin-bottom:10px}
.sec-sub{text-align:center;color:var(--m);font-size:.88rem;margin-bottom:36px}
.divider{width:36px;height:2px;background:var(--ac);margin:0 auto 36px}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:translateY(0)}
.tabs{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;justify-content:center;flex-wrap:wrap}
.tabs::-webkit-scrollbar{height:3px}
.tabs::-webkit-scrollbar-thumb{background:var(--ad)}
.tab{padding:10px 16px;background:transparent;border:1px solid var(--bd);border-bottom:none;color:var(--m);font-family:var(--f1);font-size:.8rem;cursor:pointer;transition:all .3s;white-space:nowrap;position:relative;letter-spacing:.03em}
.tab:hover{color:var(--t)}
.tab.active{color:var(--ac);border-color:var(--ad);background:var(--sf)}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--sf)}
.cat-sep{color:var(--ad);font-size:.65rem;font-family:var(--f1);display:flex;align-items:center;padding:0 4px;letter-spacing:.06em;opacity:.5}
.panel{display:none;background:var(--bg);border:1px solid var(--bd);border-top:none;padding:32px 20px}
.panel.active{display:block}
.form-wrap{max-width:560px;margin:0 auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fi{display:flex;flex-direction:column;gap:4px}
.fi label{font-size:.72rem;color:var(--m);letter-spacing:.04em}
.fi input,.fi select,.fi textarea{background:var(--s2);border:1px solid var(--bd);color:var(--t);padding:10px 12px;font-size:.88rem;font-family:var(--f2);outline:none;transition:border-color .3s}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--ad)}
.fi select option{background:var(--sf)}
.fi textarea{resize:vertical;min-height:60px}
.act{display:flex;gap:10px;margin-top:16px}
.act-btn{flex:1;padding:13px;background:transparent;border:1px solid var(--ac);color:var(--ac);font-family:var(--f1);font-size:.92rem;letter-spacing:.15em;cursor:pointer;transition:background .3s,color .3s,transform .15s}
.act-btn:hover{background:var(--ac);color:var(--bg)}
.act-btn:active{transform:.97}
.act-btn:disabled{opacity:.35;cursor:not-allowed}
.act-btn:disabled:hover{background:transparent;color:var(--ac)}
.ld{display:none;flex-direction:column;align-items:center;gap:14px;padding:36px 0}
.ld.show{display:flex}
.ld-s{width:32px;height:32px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spn .7s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.ld-t{font-size:.82rem;color:var(--m);font-family:var(--f1)}
.res{display:none;max-width:780px;margin:0 auto;animation:fu .5s ease}
.res.show{display:block}
.res-time{text-align:center;font-family:var(--f3);font-size:.85rem;color:var(--ad);margin-bottom:20px;letter-spacing:.05em}

/* Card fan */
.card-fan{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:0 auto 24px;perspective:800px}
.cd{width:100px;height:155px;perspective:500px;opacity:0;transform:translateY(24px) rotateY(90deg);transition:opacity .5s,transform .6s}
.cd.vis{opacity:1;transform:translateY(0) rotateY(0)}
.cd-inner{width:100%;height:100%;transition:transform .8s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;position:relative}
.cd.fl .cd-inner{transform:rotateY(180deg)}
.cd-f,.cd-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px}
.cd-f{background:linear-gradient(145deg,#1e1e30,#12121e);border:1px solid var(--ad)}
.cd-f .cb-s{position:absolute;inset:6px;border:1px solid rgba(201,162,77,.12);border-radius:3px}
.cd-f .cb-i{font-size:1.8rem;color:var(--ac);opacity:.4}
.cd-f .cb-t{font-size:.48rem;color:var(--ad);opacity:.3;margin-top:3px;font-family:var(--f1);letter-spacing:.1em}
.cd-b{background:linear-gradient(145deg,#1a1a2a,#10101a);border:1px solid var(--bd);transform:rotateY(180deg);text-align:center}
.cd-idx{position:absolute;top:4px;left:6px;font-size:.55rem;color:var(--ad);font-family:var(--f3)}
.cd-icon{font-size:2.2rem;margin-bottom:3px;line-height:1}
.cd-name{font-family:var(--f1);font-size:.78rem;font-weight:700;color:var(--ac);margin-bottom:2px}
.cd-kw{font-size:.55rem;color:var(--m);line-height:1.3;text-align:center}

/* Interpretation card */
.ic-grid{display:grid;gap:10px;margin-bottom:24px}
.ic-card{background:var(--sf);border:1px solid var(--bd);padding:16px;display:flex;gap:12px;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s,border-color .3s}
.ic-card.vis{opacity:1;transform:translateY(0)}
.ic-card:hover{border-color:var(--ad)}
.ic-l{flex-shrink:0;width:60px;text-align:center}
.ic-l .ip{font-size:.58rem;color:var(--ad);letter-spacing:.06em;margin-bottom:4px}
.ic-l .ii{font-size:1.8rem;line-height:1;margin-bottom:2px}
.ic-l .in{font-family:var(--f1);font-size:.78rem;font-weight:700;color:var(--ac)}
.ic-r{flex:1}
.ic-r .ik{font-size:.68rem;color:var(--ad);margin-bottom:6px}
.itabs{display:flex;gap:2px;margin-bottom:6px;flex-wrap:wrap}
.itab{padding:3px 9px;background:var(--s2);border:1px solid var(--bd);color:var(--m);font-size:.62rem;cursor:pointer;transition:all .2s}
.itab:hover{color:var(--t)}
.itab.on{color:var(--ac);border-color:var(--ad);background:rgba(201,162,77,.05)}
.itxt{font-size:.82rem;color:var(--t);line-height:1.8}

/* Summary */
.summary{background:var(--sf);border:1px solid var(--bd);border-left:3px solid var(--ac);padding:20px 24px;margin-bottom:20px}
.summary h4{font-family:var(--f1);font-size:.88rem;color:var(--ac);margin-bottom:10px;letter-spacing:.05em}
.summary p{font-size:.82rem;line-height:1.9}

/* Prompt text */
.prompt-box{background:var(--sf);border:1px solid var(--bd);padding:24px;margin-bottom:20px;white-space:pre-wrap;font-size:.85rem;line-height:2;color:var(--t);word-break:break-word}
.prompt-box strong,.prompt-box b{color:var(--ac)}

/* LR */
.wheel{position:relative;width:260px;height:260px;margin:0 auto 24px}
.wheel-ctr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--ac);background:var(--sf)}
.wheel-ring{position:absolute;inset:0;border:1px dashed var(--bd);border-radius:50%;opacity:.3}
.pn{position:absolute;width:58px;text-align:center;top:50%;left:50%;margin-left:-29px;margin-top:-26px;cursor:pointer;transition:transform .3s,filter .3s}
.pn:hover{transform:translate(var(--tx),var(--ty)) scale(1.12)!important;filter:brightness(1.3)}
.pn.act{filter:brightness(1.4) drop-shadow(0 0 10px var(--gw))}
.pn-ic{width:36px;height:36px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;margin:0 auto 3px;font-size:.82rem;font-family:var(--f1);font-weight:700;background:var(--sf)}
.pn-lb{font-size:.6rem;color:var(--m);font-family:var(--f1)}
.lr-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.lr-card{background:var(--sf);border:1px solid var(--bd);padding:16px;text-align:center}
.lr-card:hover{border-color:var(--ad)}
.lr-card-t{font-size:.68rem;color:var(--m);letter-spacing:.1em;margin-bottom:6px}
.lr-card-n{font-family:var(--f1);font-size:1.3rem;font-weight:900;margin-bottom:3px}
.lr-card-e{font-size:.72rem;color:var(--m);margin-bottom:6px}
.f-g{background:rgba(74,158,110,.12);color:var(--g);border:1px solid rgba(74,158,110,.3)}
.f-b{background:rgba(184,64,56,.12);color:#d06050;border:1px solid rgba(184,64,56,.3)}
.f-n{background:rgba(201,162,77,.12);color:var(--ac);border:1px solid rgba(201,162,77,.3)}
.lr-card-f{display:inline-block;padding:2px 8px;font-size:.68rem;border-radius:2px}

/* Lot */
.lot-box{text-align:center;padding:28px}
.lot-icon{font-size:3.5rem;margin-bottom:10px}
.lot-title{font-family:var(--f1);font-size:1.4rem;font-weight:900;color:var(--ac);margin-bottom:4px}
.lot-sub{font-size:.85rem;color:var(--m);margin-bottom:14px}

.retry{text-align:center;margin-top:24px}
.retry-btn{padding:8px 32px;background:transparent;border:1px solid var(--bd);color:var(--m);font-family:var(--f1);font-size:.82rem;cursor:pointer;transition:border-color .3s,color .3s}
.retry-btn:hover{border-color:var(--ac);color:var(--ac)}
.ai-btn{padding:8px 28px;background:transparent;border:1px solid var(--g);color:var(--g);font-family:var(--f1);font-size:.8rem;cursor:pointer;transition:background .3s,color .3s;margin-left:8px}
.ai-btn:hover{background:var(--g);color:var(--bg)}
.ai-btn:disabled{opacity:.4;cursor:not-allowed}
.footer{padding:36px 20px;text-align:center;border-top:1px solid var(--bd)}
.footer-logo{font-family:var(--f1);font-size:.95rem;font-weight:700;color:var(--ac);margin-bottom:6px;letter-spacing:.06em}
.footer p{font-size:.72rem;color:var(--m);line-height:1.6}
@media(max-width:768px){
.fg{grid-template-columns:1fr}
.lr-cards{grid-template-columns:1fr}
.cd{width:82px;height:128px}
.cd-icon{font-size:1.6rem}
.cd-name{font-size:.68rem}
.wheel{width:220px;height:220px}
.wheel-ctr{width:56px;height:56px;font-size:1rem}
.pn{width:48px;margin-left:-24px}
.pn-ic{width:30px;height:30px;font-size:.72rem}
.panel{padding:20px 14px}
.tab{padding:8px 10px;font-size:.72rem}
.ic-card{flex-direction:column;gap:8px;padding:12px}
.ic-l{width:auto;display:flex;align-items:center;gap:8px}
}
</style>
</head>
<body>

<nav class="nav" id="nav"><div class="nav-in"><a href="#" class="nav-logo">易道 · YiDao</a></div></nav>

<section class="hero"><div class="hero-c">

<h1>易 道</h1>

</div>
</section>

<footer class="footer">
<div class="footer-logo">易道 · YiDao</div>

</footer>

<script>
// ═══════════════════════════════
//  STATE
// ═══════════════════════════════
let cur = 'bz';
const EP = '/.netlify/functions/proxy';

// ═══════════════════════════════
//  OPTIONS
// ═══════════════════════════════
const mOpts = Array.from({length:12},(_,i)=>({v:i+1,l:`${i+1}月`}));
const dOpts = Array.from({length:31},(_,i)=>({v:i+1,l:`${i+1}日`}));
const hOpts = [{v:'0',l:'子时 23-01'},{v:'1',l:'丑时 01-03'},{v:'2',l:'寅时 03-05'},{v:'3',l:'卯时 05-07'},{v:'4',l:'辰时 07-09'},{v:'5',l:'巳时 09-11'},{v:'6',l:'午时 11-13'},{v:'7',l:'未时 13-15'},{v:'8',l:'申时 15-17'},{v:'9',l:'酉时 17-19'},{v:'10',l:'戌时 19-21'},{v:'11',l:'亥时 21-23'}];
const gOpts = [{v:'male',l:'男'},{v:'female',l:'女'}];
const qF = {id:'q',label:'所问之事',type:'textarea',ph:'请描述你的问题…'};
const YF = {id:'y',label:'出生年',type:'number',ph:'1990'};
const MF = {id:'m',label:'出生月',type:'select',opts:mOpts,req:1};
const DF = {id:'d',label:'出生日',type:'select',opts:dOpts,req:1};
const HF = {id:'h',label:'出生时',type:'select',opts:hOpts,req:1};
const GF = {id:'g',label:'性别',type:'select',opts:gOpts,def:'male'};

function ti(h){return parseInt(h)||0}

// ═══════════════════════════════
//  MODULE DEFINITIONS
// ═══════════════════════════════
const MODS = [
{id:'bz',cat:'命理',name:'八字排盘',icon:'☰',ep:'/bazi/calculate',
 fields:[YF,MF,DF,HF,GF],
 body(f){return{gender:f.g,year:+f.y,month:+f.m,day:+f.d,timeIndex:ti(f.h),dateType:'solar',detailMode:'compact'}},
 promptEp:'/bazi/prompt',
 promptBody(f,q){return{gender:f.g,year:+f.y,month:+f.m,day:+f.d,timeIndex:ti(f.h),dateType:'solar',question:q,promptTopic:'life',responseMode:'summary'}}},

{id:'zw',cat:'命理',name:'紫微斗数',icon:'☆',ep:'/ziwei/calculate',
 fields:[YF,MF,DF,HF,GF],
 body(f){return{gender:f.g,year:String(+f.y),month:+f.m,day:+f.d,timeIndex:ti(f.h),dateType:'solar',detailMode:'compact'}},
 promptEp:'/ziwei/prompt',
 promptBody(f,q){return{gender:f.g,year:String(+f.y),month:+f.m,day:+f.d,timeIndex:ti(f.h),dateType:'solar',question:q,promptTopic:'life',promptScope:'origin',responseMode:'summary'}}},

{id:'xp',cat:'命理',name:'西洋星盘',icon:'✧',ep:'/divination/astrolabe',
 fields:[YF,MF,DF,HF,{id:'i',label:'分钟',type:'number',ph:'0'},{id:'lat',label:'纬度',type:'number',ph:'39.9'},{id:'lon',label:'经度',type:'number',ph:'116.4'}],
 body(f){return{year:+f.y,month:+f.m,day:+f.d,hour:parseInt(f.h)||0,minute:+f.i||0,latitude:+f.lat||39.9,longitude:+f.lon||116.4,timezone:8,locationName:'北京',detailMode:'compact'}},
 promptEp:'/divination/astrolabe/prompt',
 promptBody(f,q){return{year:+f.y,month:+f.m,day:+f.d,hour:parseInt(f.h)||0,minute:+f.i||0,latitude:+f.lat||39.9,longitude:+f.lon||116.4,timezone:8,locationName:'北京',question:q,astrolabeTopic:'life',responseMode:'summary'}}},

{id:'ly',cat:'易经',name:'六爻占卜',icon:'☲',ep:'/divination/liuyao',
 fields:[qF,{id:'m',label:'起卦方式',type:'select',opts:[{v:'time',l:'时间起卦'},{v:'coins',l:'铜钱摇卦'}],def:'time'}],
 body(f){return{liuyaoMethod:f.m||'time'}},
 promptEp:'/divination/liuyao/prompt',
 promptBody(f,q){return{question:q||'请起卦',liuyaoMethod:f.m||'time',responseMode:'summary'}}},

{id:'mh',cat:'易经',name:'梅花易数',icon:'❀',ep:'/divination/meihua',
 fields:[qF,{id:'m',label:'起卦方式',type:'select',opts:[{v:'time',l:'时间起卦'},{v:'number',l:'数字起卦'},{v:'random',l:'随机'}],def:'time'},{id:'n',label:'数字',type:'number',ph:'如 58'}],
 body(f){const b={method:f.m||'time'};if(f.m==='number'&&f.n)b.number=+f.n;return b},
 promptEp:'/divination/meihua/prompt',
 promptBody(f,q){const b={question:q||'请起卦',method:f.m||'time',responseMode:'summary'};if(f.m==='number'&&f.n)b.number=+f.n;return b}},

{id:'qm',cat:'术数',name:'奇门遁甲',icon:'◎',ep:'/divination/qimen',
 fields:[qF,{id:'m',label:'盘法',type:'select',opts:[{v:'zhuanpan',l:'转盘法'},{v:'feipan',l:'飞盘法'}],def:'zhuanpan'}],
 body(f){return{qimenMethod:f.m||'zhuanpan'}},
 promptEp:'/divination/qimen/prompt',
 promptBody(f,q){return{question:q||'请排盘',qimenMethod:f.m||'zhuanpan',responseMode:'summary'}}},

{id:'dlr',cat:'术数',name:'大六壬',icon:'☷',ep:'/divination/liuren',
 fields:[qF,{id:'t',label:'课式',type:'select',opts:[{v:'general',l:'通用'},{v:'ganqing',l:'感情'},{v:'shiye',l:'事业'},{v:'caifu',l:'财运'}],def:'general'}],
 body(f){return{liurenTemplate:f.t||'general'}},
 promptEp:'/divination/liuren/prompt',
 promptBody(f,q){return{question:q||'请排课',liurenTemplate:f.t||'general',responseMode:'summary'}}},

{id:'lr',cat:'术数',name:'小六壬',icon:'☴',ep:'/divination/xiaoliuren',
 fields:[{id:'q',label:'所问之事（可选）',type:'textarea',ph:'心中默想所问之事'}],
 body(f){return{}},
 promptEp:'/divination/xiaoliuren/prompt',

document.addEventListener('DOMContentLoaded',()=>{

        const p=document.createElement('div');p.className='panel'+(m.id===cur?' active':'');p.id='p-'+m.id;
        let h=`<div class="sec-t" style="margin-top:0">${m.icon} ${m.name}</div><div class="sec-sub">${m.desc}</div><div class="divider"></div>`;
        if(m.fields.length){h+='<div class="form-wrap"><div class="fg">';m.fields.forEach(f=>{h+=`<div class="fi"><label>${f.label}</label>`;if(f.type==='select')h+=`<select id="${m.id}-${f.id}">${f.opts.map(o=>`<option value="${o.v}"${o.v===f.def?' selected':''}>${o.l}</option>`).join('')}</select>`;else if(f.type==='textarea')h+=`<textarea id="${m.id}-${f.id}" placeholder="${f.ph||''}" rows="2"></textarea>`;else h+=`<input type="${f.type}" id="${m.id}-${f.id}" placeholder="${f.ph||''}">`;h+='</div>'});h+=`</div><div class="act"><button class="act-btn" id="btn-${m.id}" onclick="doCalc('${m.id}')">${getLabel(m.id)}</button></div></div>`}
        else h+=`<div style="text-align:center;margin-bottom:20px"><button class="act-btn" id="btn-${m.id}" onclick="doCalc('${m.id}')" style="display:inline-block">${getLabel(m.id)}</button></div>`;
        h+=`<div class="ld" id="ld-${m.id}"><div class="ld-s"></div><span class="ld-t">${getLoadText(m.id)}</span></div><div class="res" id="res-${m.id}"></div>`;
        p.innerHTML=h;panelsEl.appendChild(p);
    });

function swTab(id){cur=id;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.id===id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='p-'+id))}
function getLabel(id){return{bz:'排 盘',zw:'排 盘',xp:'排 盘',ly:'摇 卦',mh:'起 卦',qm:'排 盘',dlr:'排 盘',lr:'起 卦',tl:'抽 牌',lnm:'抽 牌',lq:'求 签'}[id]||'确 认'}
function getLoadText(id){return{bz:'排盘中…',zw:'排盘中…',xp:'排盘中…',ly:'摇卦中…',mh:'起卦中…',qm:'排盘中…',dlr:'排盘中…',lr:'掐指中…',tl:'翻牌中…',lnm:'翻牌中…',lq:'求签中…'}[id]||'加载中…'}
function getQ(id){const el=document.getElementById(id+'-q');return el?el.value.trim():''}
function getForm(id){const m=MODS.find(x=>x.id===id),f={};m.fields.forEach(x=>{const el=document.getElementById(id+'-'+x.id);if(el)f[x.id]=el.value});return f}

//  API CALLER
// ═══════════════════════════════
async function doCalc(id){
    const m=MODS.find(x=>x.id===id),btn=document.getElementById('btn-'+id),ld=document.getElementById('ld-'+id),res=document.getElementById('res-'+id);
    btn.disabled=true;res.classList.remove('show');res.innerHTML='';ld.classList.add('show');
    const f=getForm(id),q=getQ(id);
    // Use prompt endpoint with summary for AI interpretation
    const ep=m.promptEp||m.ep;
    const body=m.promptBody?m.promptBody(f,q):m.body(f);
    // Add responseMode for prompt endpoints
    if(ep.includes('/prompt')&&!body.responseMode)body.responseMode='summary';
    try{
        const r=await fetch(EP+'?ep='+encodeURIComponent(ep),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const data=await r.json();
        ld.classList.remove('show');
        if(!data.ok)throw new Error(data.error?.message||'请求失败');
        renderResult(data,id);
    }catch(e){ld.classList.remove('show');res.innerHTML=`<div class="prompt-box" style="text-align:center;color:#d06050">${e.message}</div>`;res.classList.add('show')}
    finally{btn.disabled=false}
}

// AI interpretation button
async function getAI(id){
    const m=MODS.find(x=>x.id===id);if(!m.promptEp)return;
    const btn=document.getElementById('ai-'+id);if(btn){btn.disabled=true;btn.textContent='AI 解读中…'}
    const f=getForm(id),q=getQ(id)||'请对此做详细解读';
    const body=m.promptBody?m.promptBody(f,q):{...m.body(f),question:q,responseMode:'summary'};
    if(!body.responseMode)body.responseMode='summary';
    try{
        const r=await fetch(EP+'?ep='+encodeURIComponent(m.promptEp),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const data=await r.json();
        if(!data.ok)throw new Error(data.error?.message||'请求失败');
        const d=data.data||{};
        const box=document.getElementById('ai-box-'+id);
        if(box&&d.prompt){box.innerHTML=`<div class="prompt-box">${escHtml(d.prompt)}</div>`;box.style.display='block'}
    }catch(e){alert('AI解读失败：'+e.message)}
    finally{if(btn){btn.disabled=false;btn.textContent='🔮 AI 深度解读'}}
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ═══════════════════════════════
//  RENDER RESULT
// ═══════════════════════════════
function renderResult(data,id){
    const d=data.data||{},el=document.getElementById('res-'+id);
    let h=`<div class="res-time">${new Date().toLocaleString('zh-CN')}</div>`;
    // Module-specific structured rendering
    const structured=renderStructured(d,id);
    if(structured)h+=structured;
    // Prompt text
    if(d.prompt)h+=`<div class="prompt-box">${escHtml(d.prompt)}</div>`;
    // If nothing rendered
    if(!structured&&!d.prompt)h+=`<div class="prompt-box">${escHtml(JSON.stringify(d,null,2))}</div>`;
    // AI button + retry
    const m=MODS.find(x=>x.id===id);
    h+=`<div class="retry"><button class="retry-btn" onclick="doCalc('${id}')">重新操作</button>`;
    if(m.promptEp)h+=`<button class="ai-btn" id="ai-${id}" onclick="getAI('${id}')">🔮 AI 深度解读</button>`;
    h+=`</div><div id="ai-box-${id}" style="display:none"></div>`;
    el.innerHTML=h;el.classList.add('show');
    setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),200);
}

// ═══════════════════════════════
//  STRUCTURED RENDERERS
// ═══════════════════════════════
function renderStructured(d,id){
    switch(id){
        case 'bz':return rBZ(d);
        case 'tl':return rCards(d,'tarot');
        case 'lnm':return rCards(d,'lenormand');
        case 'lr':return rLR(d);
        case 'lq':return rLot(d);
        default:return '';
    }
}

function rBZ(d){
    // Search for pillar-like data recursively
    const pillars=findInObj(d,v=>typeof v==='string'&&/^[甲乙丙丁戊己庚辛壬癸]$/.test(v));
    // Try known structures
    const p=d.pillars||d.bazi||d.fourPillars||null;
    if(!p&&!pillars.length)return '';
    let h='';
    if(p&&typeof p==='object'){
        const keys=Array.isArray(p)?['year','month','day','hour']:Object.keys(p);
        const labels=['年柱','月柱','日柱','时柱'];
        const arr=Array.isArray(p)?p:keys.map(k=>p[k]);
        if(arr.length>=4){
            h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">';
            arr.forEach((v,i)=>{
                const stem=typeof v==='object'?(v.stem||v.tianGan||v.heavenlyStem||''):'';
                const branch=typeof v==='object'?(v.branch||v.diZhi||v.earthlyBranch||''):String(v);
                h+=`<div style="background:var(--sf);border:1px solid var(--bd);padding:16px 8px;text-align:center"><div style="font-size:.68rem;color:var(--m);letter-spacing:.1em;margin-bottom:8px">${labels[i]}</div><div style="font-family:var(--f1);font-size:1.8rem;font-weight:900;color:var(--ac);line-height:1">${stem||branch.slice(0,1)}</div><div style="font-family:var(--f1);font-size:1.4rem;font-weight:700;line-height:1;margin:4px 0">${branch}</div></div>`;
            });
            h+='</div>';
        }
    }
    return h;
}
function findInObj(obj,test){
    const found=[];
    (function walk(o){if(!o||typeof o!=='object')return;if(typeof o==='string'&&test(o)){found.push(o);return}if(Array.isArray(o))o.forEach(walk);else Object.values(o).forEach(walk)})(obj);
    return found;
}

// ── Card Fan (Tarot & Lenormand) ──
function rCards(d,type){
    const db=type==='tarot'?TAROT_DB:LNM_DB;
    const allNames=type==='tarot'?TAROT_NAMES:LNM_NAMES;
    // Find card names in response
    const found=[];
    (function walk(o){if(!o||typeof o!=='object')return;if(typeof o==='string'){allNames.forEach(n=>{if(o.includes(n)&&!found.includes(n))found.push(n)});return}if(Array.isArray(o))o.forEach(walk);else Object.values(o).forEach(walk)})(d);
    if(!found.length)return '';
    let h='<div class="card-fan">';
    found.forEach((nm,i)=>{
        const card=db[nm];
        const icon=card?card.i:'🃏';
        h+=`<div class="cd" id="cd-${cur}-${i}" style="transition-delay:${i*.12}s"><div class="cd-inner"><div class="cd-f"><div class="cb-s"></div><span class="cb-i">✦</span><span class="cb-t">${type==='tarot'?'TAROT':'LENORMAND'}</span></div><div class="cd-b"><span class="cd-idx">${i+1}</span><div class="cd-icon">${icon}</div><div class="cd-name">${nm}</div>${card?`<div class="cd-kw">${card.kw}</div>`:''}</div></div></div>`;
    });
    h+='</div>';
    // Interpretation cards
    if(found.length>1){
        const spread={3:['过去','现在','未来'],5:['过去','现在','未来','建议','结果'],7:['过去','当前','近期','挑战','环境','建议','结果'],9:['过去','潜意识','近期','障碍','核心','助力','建议','希望','结果']};
        const positions=spread[found.length]||found.map((_,i)=>'第'+(i+1)+'位');
        h+=`<div class="ic-grid" style="grid-template-columns:repeat(${Math.min(found.length,3)},1fr)">`;
        found.forEach((nm,i)=>{
            const card=db[nm];if(!card)return;
            const uid=`${cur}i${i}`;
            const isLNM=type==='lenormand'&&card.l;
            h+=`<div class="ic-card" id="ic-${cur}-${i}"><div class="ic-l"><div class="ip">${positions[i]||''}</div><div class="ii">${card.i}</div><div class="in">${nm}</div></div><div class="ic-r"><div class="ik">${card.kw||''}</div>`;
            if(isLNM)h+=`<div class="itabs"><button class="itab on" onclick="swI('${uid}','g',this)">总论</button><button class="itab" onclick="swI('${uid}','l',this)">感情</button><button class="itab" onclick="swI('${uid}','c',this)">事业</button><button class="itab" onclick="swI('${uid}','h',this)">健康</button></div>`;
            h+=`<div class="itxt" id="it-${uid}">${card.t||card.g||''}</div></div></div>`;
        });
        h+='</div>';
    }
    // Summary
    if(found.length>=3){
        const names=found.map(n=>`<strong>${n}</strong>`).join('、');
        h+=`<div class="summary"><h4>牌面总览</h4><p>本次抽到：${names}。请结合各牌含义综合理解。</p></div>`;
    }
    // Stagger animation
    setTimeout(()=>{
        found.forEach((_,i)=>{const c=document.getElementById(`cd-${cur}-${i}`);if(c){c.classList.add('vis');setTimeout(()=>c.classList.add('fl'),400+i*100)}});
        found.forEach((_,i)=>{const c=document.getElementById(`ic-${cur}-${i}`);if(c)setTimeout(()=>c.classList.add('vis'),found.length*200+i*100)});
    },100);
    return h;
}
function swI(uid,type,btn){
    const el=document.getElementById('it-'+uid);if(!el)return;
    const card=btn.closest('.ic-card');
    const nm=card.querySelector('.in')?.textContent;
    const db=LNM_DB[nm]||TAROT_DB[nm];if(!db)return;
    el.textContent=db[type]||db.t||db.g||'';
    card.querySelectorAll('.itab').forEach(t=>t.classList.remove('on'));btn.classList.add('on');
}

// ── Xiao Liu Ren ──
function rLR(d){
    const found=LR_NAMES.filter(n=>JSON.stringify(d).includes(n));
    if(!found.length)return '';
    let h='';
    // Wheel
    h+='<div class="wheel"><div class="wheel-ring"></div><div class="wheel-ctr">☰</div>';
    LR_POS.forEach((pos,i)=>{const a=(i*60-90)*Math.PI/180,r=95,x=Math.cos(a)*r,y=Math.sin(a)*r;const act=found.includes(pos.n)?' act':'';h+=`<div class="pn${act}" style="--tx:${x}px;--ty:${y}px;--gw:${pos.c};transform:translate(${x}px,${y}px)"><div class="pn-ic" style="border-color:${pos.c};color:${pos.c}">${pos.n[0]}</div><div class="pn-lb">${pos.n}</div></div>`});
    h+='</div>';
    // Cards
    h+='<div class="lr-cards">';
    const cls=['月课','日课','时课'];
    cls.forEach((lb,i)=>{
        const nm=found[i]||'';
        const pos=LR_POS.find(p=>p.n===nm);
        if(pos)h+=`<div class="lr-card"><div class="lr-card-t">${lb}</div><div class="lr-card-n" style="color:${pos.c}">${pos.n}</div><div class="lr-card-e">${pos.el} · ${pos.sp}</div><span class="lr-card-f f-${pos.f==='吉'?'g':pos.f==='凶'?'b':'n'}">${pos.f}</span></div>`;
        else h+=`<div class="lr-card"><div class="lr-card-t">${lb}</div><div class="lr-card-n">${nm||'—'}</div></div>`;
    });
    h+='</div>';
    return h;
}

// ── Lot ──
function rLot(d){
    // Search for lot-like data
    const title=findVal(d,'name')||findVal(d,'title')||findVal(d,'sign')||findVal(d,'lotName')||'';
    const level=findVal(d,'fortune')||findVal(d,'level')||findVal(d,'ji')||'';
    const poem=findVal(d,'poem')||findVal(d,'content')||findVal(d,'text')||findVal(d,'poemText')||'';
    if(!title&&!poem)return '';
    let h='<div class="lot-box"><div class="lot-icon">🎋</div>';
    if(title)h+=`<div class="lot-title">${title}</div>`;
    if(level)h+=`<div class="lot-sub">${level}</div>`;
    h+='</div>';
    if(poem)h+=`<div class="prompt-box" style="text-align:center;font-family:var(--f1);white-space:pre-line">${escHtml(poem)}</div>`;
    return h;
}
function findVal(obj,key){
    if(!obj||typeof obj!=='object')return'';
    if(obj[key])return String(obj[key]);
    for(const v of Object.values(obj)){if(typeof v==='object'){const r=findVal(v,key);if(r)return r}}
    return'';
}
