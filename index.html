<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易道 · YiDao — 十一大占卜系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#08080e;--surface:#111119;--s2:#1a1a25;--s3:#242435;
--accent:#c9a24d;--accent-dim:#8b6914;--accent-glow:rgba(201,162,77,.15);
--text:#e8e0d0;--muted:#6e6760;--red:#b84038;--green:#4a9e6e;--blue:#4a80b4;
--border:#2a2a3a;
--f1:'Noto Serif SC','Songti SC',serif;
--f2:'Noto Sans SC','PingFang SC',sans-serif;
--f3:'Cormorant Garamond',serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--f2);background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.03}
.container{max-width:1000px;margin:0 auto;padding:0 20px}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 20px;transition:background .4s}
.nav.scrolled{background:rgba(8,8,14,.92);backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--border)}
.nav-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.nav-logo{font-family:var(--f1);font-size:1.3rem;font-weight:900;color:var(--accent);text-decoration:none;letter-spacing:.08em}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;text-align:center}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(201,162,77,.06),transparent 50%),radial-gradient(ellipse at 70% 30%,rgba(184,64,56,.04),transparent 50%)}
.hero-c{position:relative;z-index:2;padding-top:56px}
.hero-sym{font-size:5rem;color:var(--accent);text-shadow:0 0 60px var(--accent-glow);animation:pulse 4s ease-in-out infinite;display:block;margin-bottom:20px}
@keyframes pulse{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
.hero h1{font-family:var(--f1);font-size:clamp(2.2rem,7vw,4rem);font-weight:900;letter-spacing:.15em;margin-bottom:12px;opacity:0;animation:fu 1s .3s forwards}
.hero-sub{font-family:var(--f3);font-size:clamp(.85rem,2vw,1rem);color:var(--accent-dim);letter-spacing:.2em;margin-bottom:10px;opacity:0;animation:fu 1s .5s forwards}
.hero p{color:var(--muted);margin-bottom:40px;opacity:0;animation:fu 1s .7s forwards}
.hero-cta{display:inline-block;padding:12px 40px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-family:var(--f1);letter-spacing:.12em;transition:background .3s,color .3s;opacity:0;animation:fu 1s .9s forwards}
.hero-cta:hover{background:var(--accent);color:var(--bg)}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* SECTION */
.sec{padding:72px 0}
.sec-t{font-family:var(--f1);font-size:clamp(1.4rem,3.5vw,2rem);font-weight:700;text-align:center;margin-bottom:10px}
.sec-sub{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:36px}
.divider{width:36px;height:2px;background:var(--accent);margin:0 auto 36px}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:translateY(0)}

/* TABS */
.tabs{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;justify-content:center;flex-wrap:wrap;margin-bottom:0}
.tabs::-webkit-scrollbar{height:3px}
.tabs::-webkit-scrollbar-thumb{background:var(--accent-dim)}
.tab{padding:10px 18px;background:transparent;border:1px solid var(--border);border-bottom:none;color:var(--muted);font-family:var(--f1);font-size:.82rem;cursor:pointer;transition:all .3s;white-space:nowrap;position:relative;letter-spacing:.03em}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-color:var(--accent-dim);background:var(--surface)}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--surface)}
.panel{display:none;background:var(--bg);border:1px solid var(--border);border-top:none;padding:32px 24px}
.panel.active{display:block}

/* FORM */
.form-wrap{max-width:600px;margin:0 auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.fi{display:flex;flex-direction:column;gap:4px}
.fi label{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.fi input,.fi select{background:var(--s2);border:1px solid var(--border);color:var(--text);padding:10px 12px;font-size:.9rem;font-family:var(--f2);outline:none;transition:border-color .3s}
.fi input:focus,.fi select:focus{border-color:var(--accent-dim)}
.fi select option{background:var(--surface)}
.act{display:flex;gap:10px;margin-top:18px}
.act-btn{flex:1;padding:13px;background:transparent;border:1px solid var(--accent);color:var(--accent);font-family:var(--f1);font-size:.95rem;letter-spacing:.15em;cursor:pointer;transition:background .3s,color .3s,transform .15s}
.act-btn:hover{background:var(--accent);color:var(--bg)}
.act-btn:active{transform:.97}
.act-btn:disabled{opacity:.35;cursor:not-allowed}
.act-btn:disabled:hover{background:transparent;color:var(--accent)}

/* LOADING */
.ld{display:none;flex-direction:column;align-items:center;gap:14px;padding:36px 0}
.ld.show{display:flex}
.ld-s{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-t{font-size:.82rem;color:var(--muted);font-family:var(--f1)}

/* GENERIC RESULT */
.res{display:none;max-width:780px;margin:0 auto;animation:fu .5s ease}
.res.show{display:block}
.res-hd{font-family:var(--f3);font-size:.88rem;color:var(--accent-dim);text-align:center;margin-bottom:20px;letter-spacing:.05em}
.res-body{background:var(--surface);border:1px solid var(--border);padding:24px;line-height:1.9;font-size:.88rem}
.res-body p{margin-bottom:10px}
.res-body strong{color:var(--accent)}
.res-body .dk{color:var(--accent);font-weight:700;font-size:.82rem;margin-bottom:6px;display:block;letter-spacing:.04em}
.res-body .dv{padding-left:12px;margin-bottom:8px}
.res-body .arr{padding-left:8px;margin-bottom:6px}
.retry{text-align:center;margin-top:24px}
.retry-btn{padding:8px 32px;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:var(--f1);font-size:.85rem;cursor:pointer;transition:border-color .3s,color .3s}
.retry-btn:hover{border-color:var(--accent);color:var(--accent)}

/* BAZI PILLARS */
.pillar-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.pillar{background:var(--surface);border:1px solid var(--border);padding:16px 8px;text-align:center}
.pillar-lb{font-size:.68rem;color:var(--muted);letter-spacing:.1em;margin-bottom:8px}
.pillar-stem{font-family:var(--f1);font-size:1.8rem;font-weight:900;color:var(--accent);line-height:1}
.pillar-branch{font-family:var(--f1);font-size:1.4rem;font-weight:700;line-height:1;margin:4px 0 3px}
.pillar-el{font-size:.7rem;color:var(--muted)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:20px}
.info-it{background:var(--surface);border:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:3px}
.info-it .il{font-size:.65rem;color:var(--muted);letter-spacing:.06em}
.info-it .iv{font-family:var(--f1);font-size:.9rem;font-weight:700}

/* LR WHEEL */
.wheel{position:relative;width:280px;height:280px;margin:0 auto 28px}
.wheel-ctr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--accent);background:var(--surface)}
.wheel-ring{position:absolute;inset:0;border:1px dashed var(--border);border-radius:50%;opacity:.3}
.pn{position:absolute;width:64px;text-align:center;top:50%;left:50%;margin-left:-32px;margin-top:-28px;cursor:pointer;transition:transform .3s,filter .3s}
.pn:hover{transform:translate(var(--tx),var(--ty)) scale(1.12)!important;filter:brightness(1.3)}
.pn.act{filter:brightness(1.4) drop-shadow(0 0 10px var(--gw))}
.pn-ic{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:.9rem;font-family:var(--f1);font-weight:700;background:var(--surface)}
.pn-lb{font-size:.65rem;color:var(--muted);font-family:var(--f1)}
.lr-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.lr-card{background:var(--surface);border:1px solid var(--border);padding:18px;text-align:center}
.lr-card:hover{border-color:var(--accent-dim)}
.lr-card-t{font-size:.7rem;color:var(--muted);letter-spacing:.12em;margin-bottom:8px}
.lr-card-n{font-family:var(--f1);font-size:1.4rem;font-weight:900;margin-bottom:3px}
.lr-card-e{font-size:.75rem;color:var(--muted);margin-bottom:8px}
.lr-card-f{display:inline-block;padding:2px 8px;font-size:.7rem;border-radius:2px}
.f-g{background:rgba(74,158,110,.12);color:var(--green);border:1px solid rgba(74,158,110,.3)}
.f-b{background:rgba(184,64,56,.12);color:#d06050;border:1px solid rgba(184,64,56,.3)}
.f-n{background:rgba(201,162,77,.12);color:var(--accent);border:1px solid rgba(201,162,77,.3)}
.hm-card{background:var(--surface);border:1px solid var(--border);padding:20px}
.hm-card h4{font-family:var(--f1);font-size:.92rem;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hm-card h4::before{content:'';width:3px;height:14px;background:var(--accent)}
.hm-card p{font-size:.85rem;line-height:1.9}

/* CARD FAN */
.card-fan{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:0 auto 28px;perspective:800px}
.cd{width:105px;height:160px;perspective:500px;opacity:0;transform:translateY(24px) rotateY(90deg);transition:opacity .5s,transform .6s}
.cd.vis{opacity:1;transform:translateY(0) rotateY(0)}
.cd-inner{width:100%;height:100%;transition:transform .8s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;position:relative}
.cd.fl .cd-inner{transform:rotateY(180deg)}
.cd-f,.cd-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px}
.cd-f{background:linear-gradient(145deg,#1e1e30,#12121e);border:1px solid var(--accent-dim)}
.cd-f-pat{position:absolute;inset:6px;border:1px solid rgba(201,162,77,.12);border-radius:3px}
.cd-f .cb-sym{font-size:2rem;color:var(--accent);opacity:.4}
.cd-f .cb-txt{font-size:.5rem;color:var(--accent-dim);opacity:.3;margin-top:3px;font-family:var(--f1);letter-spacing:.1em}
.cd-b{background:linear-gradient(145deg,#1a1a2a,#10101a);border:1px solid var(--border);transform:rotateY(180deg);text-align:center}
.cd-idx{position:absolute;top:5px;left:7px;font-size:.58rem;color:var(--accent-dim);font-family:var(--f3)}
.cd-icon{font-size:2.4rem;margin-bottom:4px;line-height:1}
.cd-name{font-family:var(--f1);font-size:.82rem;font-weight:700;color:var(--accent);margin-bottom:2px}
.cd-kw{font-size:.58rem;color:var(--muted);line-height:1.3}

/* INTERP */
.interp{display:none;max-width:780px;margin:0 auto;animation:fu .5s ease}
.interp.show{display:block}
.interp-hd{text-align:center;margin-bottom:24px}
.interp-hd h3{font-family:var(--f1);font-size:1.1rem;color:var(--accent);letter-spacing:.08em;margin-bottom:4px}
.interp-hd span{font-family:var(--f3);font-size:.85rem;color:var(--muted)}
.ic-grid{display:grid;gap:12px;margin-bottom:24px}
.ic-card{background:var(--surface);border:1px solid var(--border);padding:18px 20px;display:flex;gap:14px;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s,border-color .3s}
.ic-card.vis{opacity:1;transform:translateY(0)}
.ic-card:hover{border-color:var(--accent-dim)}
.ic-l{flex-shrink:0;width:66px;text-align:center}
.ic-l .ip{font-size:.6rem;color:var(--accent-dim);letter-spacing:.06em;margin-bottom:5px}
.ic-l .ii{font-size:2rem;line-height:1;margin-bottom:3px}
.ic-l .in{font-family:var(--f1);font-size:.82rem;font-weight:700;color:var(--accent)}
.ic-r{flex:1}
.ic-r .ik{font-size:.7rem;color:var(--accent-dim);margin-bottom:8px}
.itabs{display:flex;gap:2px;margin-bottom:8px;flex-wrap:wrap}
.itab{padding:3px 10px;background:var(--s2);border:1px solid var(--border);color:var(--muted);font-size:.65rem;cursor:pointer;transition:all .2s}
.itab:hover{color:var(--text)}
.itab.on{color:var(--accent);border-color:var(--accent-dim);background:rgba(201,162,77,.05)}
.itxt{font-size:.85rem;color:var(--text);line-height:1.8}
.summary{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);padding:20px 24px;margin-bottom:20px}
.summary h4{font-family:var(--f1);font-size:.9rem;color:var(--accent);margin-bottom:10px;letter-spacing:.05em}
.summary p{font-size:.85rem;line-height:1.9}

/* LOTS */
.lot-box{text-align:center;padding:32px}
.lot-icon{font-size:4rem;margin-bottom:12px}
.lot-title{font-family:var(--f1);font-size:1.6rem;font-weight:900;color:var(--accent);margin-bottom:4px}
.lot-sub{font-size:.88rem;color:var(--muted);margin-bottom:16px}

/* FOOTER */
.footer{padding:36px 20px;text-align:center;border-top:1px solid var(--border)}
.footer-logo{font-family:var(--f1);font-size:.95rem;font-weight:700;color:var(--accent);margin-bottom:6px;letter-spacing:.06em}
.footer p{font-size:.72rem;color:var(--muted);line-height:1.6}

/* RESPONSIVE */
@media(max-width:768px){
.fg{grid-template-columns:1fr}
.pillar-row{grid-template-columns:repeat(2,1fr)}
.lr-cards{grid-template-columns:1fr}
.cd{width:88px;height:135px}
.cd-icon{font-size:1.8rem}
.cd-name{font-size:.72rem}
.cd-kw{font-size:.52rem}
.wheel{width:240px;height:240px}
.wheel-ctr{width:60px;height:60px;font-size:1.1rem}
.pn{width:52px;margin-left:-26px}
.pn-ic{width:34px;height:34px;font-size:.78rem}
.panel{padding:24px 16px}
.tab{padding:8px 12px;font-size:.75rem}
.ic-card{flex-direction:column;gap:8px;padding:14px}
.ic-l{width:auto;display:flex;align-items:center;gap:8px}
}
@media(max-width:480px){
.wheel{width:200px;height:200px}
.cd{width:76px;height:118px;gap:6px}
}
</style>
</head>
<body>

<nav class="nav" id="nav"><div class="nav-in"><a href="#" class="nav-logo">易道 · YiDao</a></div></nav>

<section class="hero" id="hero">
<div class="hero-c">
<span class="hero-sym">☯</span>
<h1>易 道</h1>
<div class="hero-sub">YIDAO · ELEVEN DIVINATION SYSTEMS</div>
<p>八字 · 紫微 · 星盘 · 六爻 · 梅花 · 奇门 · 大六壬 · 小六壬 · 塔罗 · 雷诺曼 · 灵签</p>
<a href="#modules" class="hero-cta">开始探索</a>
</div>
</section>

<section class="sec" id="modules" style="background:var(--surface)">
<div class="container">
<div class="tabs reveal" id="tabs"></div>
<div id="panels"></div>
</div>
</section>

<footer class="footer">
<div class="footer-logo">易道 · YiDao</div>
<p>传统文化仅供学习参考，不作为决策依据<br>数据来源：t1qq.com 易学 API &middot; 如遇接口路径问题请在 MODULES 配置中修改 api 字段</p>
</footer>

<script>
// ═══════════════════════════════════
//  STATE
// ═══════════════════════════════════
const K = window.API_KEY || '';
let cur = 'bz';

// ═══════════════════════════════════
//  OPTIONS HELPERS
// ═══════════════════════════════════
const monthOpts = Array.from({length:12},(_,i)=>({v:i+1,l:`${i+1}月`}));
const dayOpts = Array.from({length:31},(_,i)=>({v:i+1,l:`${i+1}日`}));
const hourOpts = [
{v:'00',l:'子时 23-01'},{v:'01',l:'丑时 01-03'},{v:'03',l:'寅时 03-05'},{v:'05',l:'卯时 05-07'},
{v:'07',l:'辰时 07-09'},{v:'09',l:'巳时 09-11'},{v:'11',l:'午时 11-13'},{v:'13',l:'未时 13-15'},
{v:'15',l:'申时 15-17'},{v:'17',l:'酉时 17-19'},{v:'19',l:'戌时 19-21'},{v:'21',l:'亥时 21-23'}
];
const genderOpts = [{v:'0',l:'男（乾造）'},{v:'1',l:'女（坤造）'}];
const spread13579 = [{v:'1',l:'单牌'},{v:'3',l:'三牌'},{v:'5',l:'五牌'},{v:'7',l:'七牌'},{v:'9',l:'九牌'}];
const spread135 = [{v:'1',l:'单牌'},{v:'3',l:'三牌'},{v:'5',l:'五牌'}];

function sOpts(arr){return arr.map(o=>`<option value="${o.v}">${o.l}</option>`).join('')}
const YF = {id:'y',label:'年份',type:'number',ph:'1990'};
const MF = {id:'m',label:'月份',type:'select',opts:monthOpts,req:1};
const DF = {id:'d',label:'日期',type:'number',ph:'15',req:1};
const HF = {id:'h',label:'时辰',type:'select',opts:hourOpts,req:1};
const NF = {id:'i',label:'分钟',type:'number',ph:'0'};
const GF = {id:'x',label:'性别',type:'select',opts:genderOpts,def:'0'};

// ═══════════════════════════════════
//  MODULE DEFINITIONS
// ═══════════════════════════════════
const MODULES = [
// ── 命理 ──
{id:'bz',cat:'命理',name:'八字排盘',icon:'☰',desc:'排出四柱八字与大运流年',api:'day/paipan/bz',
 fields:[YF,MF,DF,HF,NF,GF],
 build(f){return{path:this.api,key:K,x:f.x||'0',y:f.y,m:f.m,d:f.d,h:f.h,i:f.i||'0',s:'0'}},
 render:d=>renderBZ(d)},

{id:'zw',cat:'命理',name:'紫微斗数',icon:'☆',desc:'紫微星盘排布与命宫解析',api:'day/paipan/zwds',
 fields:[YF,MF,DF,HF,NF,GF],
 build(f){return{path:this.api,key:K,x:f.x||'0',y:f.y,m:f.m,d:f.d,h:f.h,i:f.i||'0'}},
 render:d=>renderGeneric(d)},

{id:'xp',cat:'命理',name:'西洋星盘',icon:'✧',desc:'行星宫位与相位分析',api:'day/paipan/xp',
 fields:[YF,MF,DF,HF,NF],
 build(f){return{path:this.api,key:K,y:f.y,m:f.m,d:f.d,h:f.h,i:f.i||'0'}},
 render:d=>renderGeneric(d)},

// ── 易经 ──
{id:'ly',cat:'易经',name:'六爻占卜',icon:'☲',desc:'铜钱摇卦，六爻断事',api:'day/paipan/ly',
 fields:[{id:'method',label:'起卦方式',type:'select',opts:[{v:'time',l:'时间起卦'},{v:'coin',l:'铜钱摇卦'}],def:'time'}],
 build(f){return{path:this.api,key:K,method:f.method||'time'}},
 render:d=>renderGeneric(d)},

{id:'mh',cat:'易经',name:'梅花易数',icon:'❀',desc:'以数起卦，卦象断事',api:'day/paipan/mh',
 fields:[{id:'num1',label:'上卦数',type:'number',ph:'如 5'},{id:'num2',label:'下卦数',type:'number',ph:'如 3'}],
 build(f){return{path:this.api,key:K,num1:f.num1,num2:f.num2}},

function findCard(name, db) {
    if (!name) return null;
    for (const [k, v] of Object.entries(db)) {
        if (name.includes(k) || k.includes(name)) return { ...v, name: k };
    }
    return { name, ic: '🃏', kw: '—', g: `「${name}」牌义暂未录入，请参考牌面意象理解。` };
}

function cardIcon(name) {
    if (!name) return '🃏';
    for (const [k, v] of Object.entries(LNM_DB)) if (name.includes(k)) return v.ic;
    for (const [k, v] of Object.entries(TAROT_DB)) if (name.includes(k) || k.includes(name)) return v.ic;
    return '🃏';
}

//  INIT: BUILD TABS & PANELS
// ═══════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
    const tabsEl = document.getElementById('tabs');
    const panelsEl = document.getElementById('panels');
    let lastCat = '';

    MODULES.forEach(m => {
        // Category separator in tabs
        if (m.cat !== lastCat) {
            const sep = document.createElement('span');
            sep.style.cssText = 'color:var(--accent-dim);font-size:.68rem;font-family:var(--f1);display:flex;align-items:center;padding:0 6px;letter-spacing:.06em;opacity:.6';
            sep.textContent = m.cat;
            tabsEl.appendChild(sep);
            lastCat = m.cat;
        }

        // Tab button
        const tab = document.createElement('button');
        tab.className = 'tab' + (m.id === cur ? ' active' : '');
        tab.dataset.id = m.id;
        tab.innerHTML = `${m.icon} ${m.name}`;
        tab.onclick = () => switchTab(m.id);
        tabsEl.appendChild(tab);

        // Panel
        const panel = document.createElement('div');
        panel.className = 'panel' + (m.id === cur ? ' active' : '');
        panel.id = `p-${m.id}`;

        let formHtml = `<div class="sec-t" style="margin-top:0">${m.icon} ${m.name}</div><div class="sec-sub">${m.desc}</div><div class="divider"></div>`;

        if (m.fields.length) {
            formHtml += '<div class="form-wrap"><div class="fg">';
            m.fields.forEach(f => {
                formHtml += `<div class="fi"><label>${f.label}</label>`;
                if (f.type === 'select') {
                    formHtml += `<select id="${m.id}-${f.id}" ${f.req?'required':''}>${f.opts.map(o=>`<option value="${o.v}"${o.v===f.def?' selected':''}>${o.l}</option>`).join('')}</select>`;
                } else {
                    formHtml += `<input type="${f.type}" id="${m.id}-${f.id}" placeholder="${f.ph||''}" ${f.req?'required':''}>`;
                }
                formHtml += '</div>';
            });
            formHtml += `</div><div class="act"><button class="act-btn" id="btn-${m.id}" onclick="doAction('${m.id}')">${getActionLabel(m.id)}</button></div></div>`;
        } else {
            formHtml += `<div style="text-align:center;margin-bottom:24px"><button class="act-btn" id="btn-${m.id}" onclick="doAction('${m.id}')" style="display:inline-block">${getActionLabel(m.id)}</button></div>`;
        }

        formHtml += `<div class="ld" id="ld-${m.id}"><div class="ld-s"></div><span class="ld-t">${getLoadingText(m.id)}</span></div>`;
        formHtml += `<div class="res" id="res-${m.id}"></div>`;
        formHtml += `<div class="interp" id="interp-${m.id}"></div>`;

        panel.innerHTML = formHtml;
        panelsEl.appendChild(panel);
    });

    // Nav scroll
    window.addEventListener('scroll', () => document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 30));

    // Reveal
    document.querySelectorAll('.reveal').forEach(el => {
        new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }), { threshold: 0.1 }).observe(el);
    });
});

function getActionLabel(id) {
    const labels = { bz:'排 盘', zw:'排 盘', xp:'排 盘', ly:'摇 卦', mh:'起 卦', qm:'排 盘', dlr:'排 盘', lr:'起 卦', tl:'抽 牌', lnm:'抽 牌', lq:'求 签' };
    return labels[id] || '确 认';
}
function getLoadingText(id) {
    const texts = { bz:'排盘计算中…', zw:'排盘计算中…', xp:'排盘计算中…', ly:'摇卦中…', mh:'起卦中…', qm:'排盘中…', dlr:'排盘中…', lr:'掐指推算中…', tl:'命运之牌翻开中…', lnm:'命运之牌翻开中…', lq:'诚心求签中…' };
    return texts[id] || '加载中…';
}

function switchTab(id) {
    cur = id;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `p-${id}`));
}

// ═══════════════════════════════════
//  API CALLER
// ═══════════════════════════════════
async function doAction(id) {
    if (!K) { alert('请在 config.js 中配置 API Key'); return; }
    const mod = MODULES.find(m => m.id === id);
    const btn = document.getElementById(`btn-${id}`);
    const ld = document.getElementById(`ld-${id}`);
    const res = document.getElementById(`res-${id}`);
    const interp = document.getElementById(`interp-${id}`);

    btn.disabled = true;
    res.classList.remove('show'); res.innerHTML = '';
    if (interp) { interp.classList.remove('show'); interp.innerHTML = ''; }

    // Collect form data
    const formData = {};
    mod.fields.forEach(f => {
        const el = document.getElementById(`${id}-${f.id}`);
        if (el) formData[f.id] = el.value;
    });

    const params = mod.build(formData);
    ld.classList.add('show');

    try {
        const qs = new URLSearchParams(params).toString();
        const resp = await fetch(`/.netlify/functions/proxy?${qs}`);
        const data = await resp.json();

        if (data.code !== 200 && data.code !== 0 && !data.data) {
            throw new Error(data.msg || data.error || `接口返回异常 (code: ${data.code})`);
        }

        ld.classList.remove('show');
        mod.render(data);
    } catch (e) {
        ld.classList.remove('show');
        res.innerHTML = `<div class="res-body" style="text-align:center;color:#d06050">${e.message}<br><small style="color:var(--muted);font-size:.75rem">如持续报错，请检查 config.js 中的 API 路径是否正确</small></div>`;
        res.classList.add('show');
    } finally {
        btn.disabled = false;
    }
}

// ── Generic ──
function renderGeneric(data) {
    const el = document.getElementById(`res-${cur}`);
    el.innerHTML = `<div class="res-hd">${new Date().toLocaleString('zh-CN')}</div><div class="res-body">${objToHTML(data)}</div><div class="retry"><button class="retry-btn" onclick="doAction('${cur}')">重新操作</button></div>`;
    el.classList.add('show');
    setTimeout(() => el.scrollIntoView({ behavior:'smooth', block:'start' }), 200);
}

function objToHTML(obj, depth) {
    depth = depth || 0;
    if (obj === null || obj === undefined) return '<span style="color:var(--muted)">—</span>';
    if (typeof obj === 'string' || typeof obj === 'number') return `<span>${obj}</span>`;
    if (Array.isArray(obj)) {
        if (obj.length === 0) return '<span style="color:var(--muted)">（空）</span>';
        // If array of strings/numbers, show inline
        if (typeof obj[0] !== 'object') return obj.map(v => `<span class="arr">${v}</span>`).join('　');
        return obj.map((v, i) => `<div style="margin-bottom:8px;padding-left:${depth*8}px">${typeof v === 'object' ? objToHTML(v, depth+1) : `<span>${v}</span>`}</div>`).join('');
    }
    if (typeof obj === 'object') {
        let html = '';
        for (const [k, v] of Object.entries(obj)) {
            if (k === 'code' || k === 'msg' && v === 'success') continue;
            const label = typeof v === 'object' ? `<span class="dk">${k}</span>` : `<span class="dk">${k}：</span>`;
            html += `<div style="padding-left:${depth*8}px">${label}<span class="dv">${objToHTML(v, depth+1)}</span></div>`;
        }
        return html;
    }
    return `<span>${obj}</span>`;
}

// ── Bazi ──
function renderBZ(data) {
    const d = data.data || data;
    const el = document.getElementById(`res-${cur}`);
    let h = '';

    // Info grid
    if (d.gl || d.nl || d.sx || d.xz || d.mz) {
        h += '<div class="info-grid">';
        const items = [
            ['命造', d.mz], ['性别', d.xb], ['生肖', d.sx], ['星座', d.xz],
            ['公历', Array.isArray(d.gl)?d.gl.join(' '):(d.gl||'')],
            ['农历', typeof d.nl==='object'&&d.nl?.gz?d.nl.gz:(Array.isArray(d.nl)?d.nl.join(' '):(d.nl||''))],
            ['日干阴阳', d.cyy], ['起运', d.qyy_desc]
        ].filter(i => i[1]);
        items.forEach(([lb, val]) => { h += `<div class="info-it"><span class="il">${lb}</span><span class="iv">${val}</span></div>`; });
        h += '</div>';
    }

    // Pillars
    const ctg = Array.isArray(d.ctg)?d.ctg:[], cdz = Array.isArray(d.cdz)?d.cdz:[];
    const ewxtg = Array.isArray(d.ewxtg)?d.ewxtg:[], ewxdz = Array.isArray(d.ewxdz)?d.ewxdz:[];
    if (ctg.length) {
        h += '<div class="pillar-row">';
        ['年柱','月柱','日柱','时柱'].forEach((lb, i) => {
            h += `<div class="pillar"><div class="pillar-lb">${lb}</div><div class="pillar-stem">${ctg[i]||'—'}</div><div class="pillar-branch">${cdz[i]||'—'}</div><div class="pillar-el">${ewxtg[i]||''} · ${ewxdz[i]||''}</div></div>`;
        });
        h += '</div>';
    }

    // DaYun
    const dy = Array.isArray(d.dy)?d.dy:[];
    if (dy.length) {
        h += '<div style="font-family:var(--f1);font-size:1rem;color:var(--accent);margin:24px 0 12px;padding-left:10px;border-left:3px solid var(--accent);letter-spacing:.05em">大运排布</div>';
        h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:20px">';
        dy.forEach((yun, i) => {
            h += `<div style="background:var(--surface);border:1px solid var(--border);padding:10px 6px;text-align:center;${i===0?'border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);':''}">
                <div style="font-size:.65rem;color:var(--muted)">${yun.zqage||''}~${yun.zboz||''}岁</div>
                <div style="font-family:var(--f1);font-size:1rem;font-weight:700;color:var(--accent)">${yun.zfma||'?'}</div>
                <div style="font-family:var(--f1);font-size:.9rem;font-weight:700">${yun.zfmb||'?'}</div>
                ${yun.nzsc?`<div style="font-size:.6rem;color:var(--accent-dim);margin-top:3px">${yun.nzsc}</div>`:''}
            </div>`;
        });
        h += '</div>';

        // LiuNian for each DaYun
        dy.forEach(yun => {
            const ly = Array.isArray(yun.ly)?yun.ly:[];
            if (ly.length) {
                h += `<div style="font-family:var(--f1);font-size:.88rem;color:var(--text);margin:14px 0 8px">${yun.zfma||''}${yun.zfmb||''}运 · 流年（${yun.zqage||''}~${yun.zboz||''}岁）</div>`;
                h += '<div style="display:flex;gap:5px;overflow-x:auto;padding-bottom:6px">';
                ly.forEach(ln => {
                    h += `<div style="min-width:52px;background:var(--s2);border:1px solid var(--border);padding:7px 5px;text-align:center;flex-shrink:0"><div style="font-size:.58rem;color:var(--muted)">${ln.year||''}</div><div style="font-family:var(--f1);font-size:.82rem;font-weight:700;color:var(--accent)">${ln.lye||''}</div><div style="font-size:.55rem;color:var(--muted)">${ln.age||''}岁</div></div>`;
                });
                h += '</div>';
            }
        });
    }

    el.innerHTML = h + `<div class="retry"><button class="retry-btn" onclick="doAction('bz')">重新排盘</button></div>`;
    el.classList.add('show');
    setTimeout(() => el.scrollIntoView({ behavior:'smooth', block:'start' }), 200);
}

// ── Xiao Liu Ren ──
function renderLR(data) {
    const el = document.getElementById(`res-${cur}`);
    let h = `<div class="res-hd">${data.time || new Date().toLocaleString('zh-CN')}</div>`;

    // Wheel (build if not exists)
    const wheelEl = document.querySelector(`#p-${cur} .wheel`);
    if (!wheelEl) {
        let wh = '<div class="wheel"><div class="wheel-ring"></div><div class="wheel-ctr">☰</div>';
        LR_POS.forEach((pos, i) => {
            const a = (i*60-90)*Math.PI/180, r=100;
            const x=Math.cos(a)*r, y=Math.sin(a)*r;
            wh += `<div class="pn" id="lrn-${i}" style="--tx:${x}px;--ty:${y}px;--gw:${pos.c};transform:translate(${x}px,${y}px)" onclick="alert('${pos.n}\\n五行：${pos.el}  方位：${pos.dir}\\n神煞：${pos.sp}  吉凶：${pos.f}\\n\\n${pos.b}')"><div class="pn-ic" style="border-color:${pos.c};color:${pos.c}">${pos.n[0]}</div><div class="pn-lb">${pos.n}</div></div>`;
        });
        wh += '</div>';
        // Inject before results
        el.insertAdjacentHTML('beforebegin', wh);
    }

    // Clear highlights
    LR_POS.forEach((_, i) => { const n=document.getElementById(`lrn-${i}`); if(n)n.classList.remove('act'); });

    // Cards
    h += '<div class="lr-cards">';
    const cls = [{l:'月课',v:data.res?.monthclass},{l:'日课',v:data.res?.dayclass},{l:'时课',v:data.res?.nowclass}];
    const activeIdx = new Set();
    cls.forEach(c => {
        const idx = LR_POS.findIndex(p => c.v && c.v.includes(p.n));
        if (idx >= 0) activeIdx.add(idx);
        const pos = idx >= 0 ? LR_POS[idx] : null;
        if (pos) {
            h += `<div class="lr-card"><div class="lr-card-t">${c.l}</div><div class="lr-card-n" style="color:${pos.c}">${pos.n}</div><div class="lr-card-e">${pos.el} · ${pos.sp} · ${pos.dir}</div><span class="lr-card-f f-${pos.f==='吉'?'g':pos.f==='凶'?'b':'n'}">${pos.f}</span></div>`;
        } else {
            h += `<div class="lr-card"><div class="lr-card-t">${c.l}</div><div class="lr-card-n">${c.v||'—'}</div></div>`;
        }
    });
    h += '</div>';

    // Highlight
    activeIdx.forEach(i => { const n=document.getElementById(`lrn-${i}`); if(n)n.classList.add('act'); });

    // Hourmsg
    if (data.hourmsg) {
        h += `<div class="hm-card"><h4>时辰注解</h4><p>${data.hourmsg.replace(/。/g,'。<br>')}</p></div>`;
    }

    h += `<div class="retry"><button class="retry-btn" onclick="doAction('lr')">重新起卦</button></div>`;
    el.innerHTML = h;
    el.classList.add('show');
    setTimeout(() => el.scrollIntoView({ behavior:'smooth', block:'start' }), 200);
}

// ── Card Draw (Tarot & Lenormand) ──
function renderCards(data, type) {
    const el = document.getElementById(`res-${cur}`);
    const interpEl = document.getElementById(`interp-${cur}`);
    el.innerHTML = '';
    interpEl.innerHTML = '';

    // Parse card names
    const raw = data.data || '';
    let names = [];
    if (typeof raw === 'string') names = raw.split(/[,，、\n\r|｜]+/).map(s=>s.trim()).filter(Boolean);
    else if (Array.isArray(raw)) names = raw.map(c => typeof c === 'object' ? (c.name || c.title || JSON.stringify(c)) : String(c));
    if (!names.length && raw) names = [String(raw)];

    const db = type === 'tarot' ? TAROT_DB : LNM_DB;

    // Card fan
    let fanHtml = '<div class="card-fan">';
    names.forEach((nm, i) => {
        const icon = cardIcon(nm);
        fanHtml += `<div class="cd" id="cd-${cur}-${i}" style="transition-delay:${i*0.12}s">
            <div class="cd-inner">
                <div class="cd-f"><div class="cd-f-pat"></div><span class="cb-sym">✦</span><span class="cb-txt">${type==='tarot'?'TAROT':'LENORMAND'}</span></div>
                <div class="cd-b"><span class="cd-idx">${i+1}</span><div class="cd-icon">${icon}</div><div class="cd-name">${nm}</div></div>
            </div>
        </div>`;
    });
    fanHtml += '</div>';
    el.innerHTML = fanHtml;
    el.classList.add('show');

    // Animate cards
    names.forEach((_, i) => {
        const card = document.getElementById(`cd-${cur}-${i}`);
        if (!card) return;
        setTimeout(() => {
            card.classList.add('vis');
            setTimeout(() => card.classList.add('fl'), 400 + i * 100);
        }, i * 150);
    });

    // Build interpretation
    setTimeout(() => {
        const spread = SP[names.length] || { l: `${names.length}牌阵`, p: names.map((_,i) => `第${i+1}位`) };
        const timeStr = data.time || new Date().toLocaleString('zh-CN');
        const resolved = names.map((nm, i) => ({ name: nm, card: findCard(nm, db), idx: i }));
        const hasDB = resolved.some(r => r.card && r.card.g && r.card.g !== `「${r.card.name}」牌义暂未录入，请参考牌面意象理解。`);

        let ih = `<div class="interp-hd"><h3>${spread.l}</h3><span>${timeStr}</span></div>`;

        if (hasDB) {
            ih += `<div class="ic-grid" style="grid-template-columns:repeat(${names.length<=3?names.length:(names.length<=5?3:2)},1fr)">`;
            resolved.forEach(({ name, card, idx }) => {
                if (!card) return;
                const posLabel = spread.p[idx] || `第${idx+1}位`;
                const uid = `${cur}i${idx}`;
                const text = card.text || card.g || '';
                ih += `<div class="ic-card" id="ic-${cur}-${idx}">
                    <div class="ic-l"><div class="ip">${posLabel}</div><div class="ii">${card.ic||'🃏'}</div><div class="in">${card.name}</div></div>
                    <div class="ic-r">
                        <div class="ik">${card.kw||''}</div>`;

                if (type === 'lenormand' && card.l) {
                    ih += `<div class="itabs">
                        <button class="itab on" onclick="swTab('${uid}','g',this)">总论</button>
                        <button class="itab" onclick="swTab('${uid}','l',this)">感情</button>
                        <button class="itab" onclick="swTab('${uid}','c',this)">事业</button>
                        <button class="itab" onclick="swTab('${uid}','h',this)">健康</button>
                    </div>`;
                }
                ih += `<div class="itxt" id="it-${uid}">${text || card.g || ''}</div></div></div>`;
            });
            ih += '</div>';

            // Summary
            ih += buildCardSummary(resolved, names.length, type);
        } else {
            ih += `<div class="summary"><h4>牌面</h4><p>${resolved.map((r,i) => `<strong>${spread.p[i]||''}</strong>：${r.name}`).join('；')}</p></div>`;
            if (data.msg && data.msg !== 'success') ih += `<div class="summary"><h4>解读</h4><p>${data.msg}</p></div>`;
        }

        ih += `<div class="retry"><button class="retry-btn" onclick="doAction('${cur}')">重新抽牌</button></div>`;
        interpEl.innerHTML = ih;
        interpEl.classList.add('show');

        // Stagger interp cards
        resolved.forEach((_, i) => {
            setTimeout(() => { const c = document.getElementById(`ic-${cur}-${i}`); if (c) c.classList.add('vis'); }, i * 100);
        });

        setTimeout(() => interpEl.scrollIntoView({ behavior:'smooth', block:'start' }), 200);
    }, names.length * 250 + 600);
}

function swTab(uid, type, btn) {
    const textEl = document.getElementById(`it-${uid}`);
    if (!textEl) return;
    const cardEl = btn.closest('.ic-card');
    const cardName = cardEl.querySelector('.in')?.textContent;
    // Try Lenormand DB first, then Tarot
    const lnmCard = cardName ? LNM_DB[cardName] : null;
    const tarotCard = cardName ? TAROT_DB[cardName] : null;
    const card = lnmCard || tarotCard;
    if (!card) return;
    textEl.textContent = card[type] || card.g || card.text || '';
    cardEl.querySelectorAll('.itab').forEach(t => t.classList.remove('on'));
    btn.classList.add('on');
}

function buildCardSummary(cards, count, type) {
    const valid = cards.filter(c => c.card && c.card.g);
    if (!valid.length) return '';
    const list = valid.map(v => v.card);
    const sp = SP[count];
    let t = '';

    if (count === 1 && list[0]) {
        t = `本次抽到<strong>${list[0].name}</strong>，${(list[0].text||list[0].g).slice(0,40)}…`;
    } else if (count === 3) {
        const parts = [];
        if (list[0]) parts.push(`过去<strong>${list[0].name}</strong>：${(list[0].text||list[0].g).slice(0,25)}…`);
        if (list[1]) parts.push(`现在<strong>${list[1].name}</strong>：${(list[1].text||list[1].g).slice(0,25)}…`);
        if (list[2]) parts.push(`未来<strong>${list[2].name}</strong>：${(list[2].text||list[2].g).slice(0,25)}…`);
        t = parts.join('　');
    } else if (count === 5) {
        const parts = [];
        if (list[0]) parts.push(`过去<strong>${list[0].name}</strong>奠定基础`);
        if (list[1]) parts.push(`当前<strong>${list[1].name}</strong>揭示现状`);
        if (list[2]) parts.push(`未来<strong>${list[2].name}</strong>指明方向`);
        if (list[3]) parts.push(`建议<strong>${list[3].name}</strong>：${(list[3].text||list[3].g).slice(0,20)}…`);
        if (list[4]) parts.push(`结果<strong>${list[4].name}</strong>：${(list[4].text||list[4].g).slice(0,20)}…`);
        t = parts.join('。');
    } else {
        t = `本次${count}牌阵抽到：${list.map(c=>c.name).join('、')}。请逐张查看详细解读，综合理解整体走势。`;
    }

    return `<div class="summary"><h4>综合解读</h4><p>${t}</p></div>`;
}

// ── Lot (灵签) ──
function renderLot(data) {
    const el = document.getElementById(`res-${cur}`);
    const d = data.data || data;
    let h = '';

    // Try to extract lot info from data
    const name = d.name || d.title || d.lot_name || d.sign || '';
    const level = d.level || d.fortune || d.ji || '';
    const poem = d.poem || d.content || d.text || d.poem_text || '';
    const explain = d.explain || d.explanation || d.meaning || d.desc || '';

    if (name || poem) {
        h += '<div class="lot-box">';
        h += `<div class="lot-icon">🎋</div>`;
        if (name) h += `<div class="lot-title">${name}</div>`;
        if (level) h += `<div class="lot-sub">${level}</div>`;
        h += '</div>';

        if (poem) h += `<div class="res-body" style="text-align:center;font-family:var(--f1);font-size:1rem;line-height:2.2;white-space:pre-line">${poem}</div>`;
        if (explain) h += `<div class="res-body" style="margin-top:12px">${explain}</div>`;
    } else {
        // Fallback to generic
        h += `<div class="res-hd">${new Date().toLocaleString('zh-CN')}</div>`;
        h += `<div class="res-body">${objToHTML(data)}</div>`;
    }

    h += `<div class="retry"><button class="retry-btn" onclick="doAction('lq')">重新求签</button></div>`;
    el.innerHTML = h;
    el.classList.add('show');
    setTimeout(() => el.scrollIntoView({ behavior:'smooth', block:'start' }), 200);
}
