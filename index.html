<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易道 · YiDao — 小六壬 / 八字 / 雷诺曼</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        /* ═══════════════════════════════════
           RESET & VARIABLES
           ═══════════════════════════════════ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #08080e; --surface: #111119; --surface-2: #1a1a25; --surface-3: #242435;
            --accent: #c9a24d; --accent-dim: #8b6914; --accent-glow: rgba(201,162,77,.15);
            --text: #e8e0d0; --text-muted: #6e6760;
            --red: #b84038; --green: #4a9e6e; --blue: #4a80b4;
            --border: #2a2a3a;
            --font-display: 'Noto Serif SC', 'Songti SC', serif;
            --font-body: 'Noto Sans SC', 'PingFang SC', sans-serif;
            --font-en: 'Cormorant Garamond', serif;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body); background: var(--bg); color: var(--text);
            line-height: 1.7; overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: .03;
        }
        .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

        /* ═══ NAV ═══ */
        .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 0 24px; transition: background .4s, box-shadow .4s; }
        .nav.scrolled { background: rgba(8,8,14,.92); backdrop-filter: blur(12px); box-shadow: 0 1px 0 var(--border); }
        .nav-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .nav-logo { font-family: var(--font-display); font-size: 1.4rem; font-weight: 900; color: var(--accent); text-decoration: none; letter-spacing: .08em; }
        .nav-links { display: flex; gap: 28px; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: .85rem; transition: color .3s; position: relative; }
        .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px; background: var(--accent); transition: width .3s; }
        .nav-links a:hover { color: var(--text); }
        .nav-links a:hover::after { width: 100%; }
        .nav-toggle { display: none; background: none; border: none; color: var(--text); font-size: 1.4rem; cursor: pointer; width: 40px; height: 40px; align-items: center; justify-content: center; }
        .mobile-menu { display: none; position: fixed; top: 64px; left: 0; right: 0; background: rgba(8,8,14,.96); backdrop-filter: blur(16px); padding: 24px; flex-direction: column; gap: 20px; border-bottom: 1px solid var(--border); }
        .mobile-menu.open { display: flex; }
        .mobile-menu a { color: var(--text); text-decoration: none; font-size: 1.1rem; padding: 8px 0; }

        /* ═══ HERO ═══ */
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 60%, rgba(201,162,77,.06) 0%, transparent 50%), radial-gradient(ellipse at 70% 30%, rgba(184,64,56,.04) 0%, transparent 50%); }
        .hero-content { position: relative; z-index: 2; text-align: center; padding-top: 80px; }
        .hero-symbol { font-size: 6rem; color: var(--accent); text-shadow: 0 0 60px var(--accent-glow), 0 0 120px rgba(201,162,77,.08); animation: pulse 4s ease-in-out infinite; margin-bottom: 24px; display: block; }
        @keyframes pulse { 0%,100% { opacity: .8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
        .hero-content h1 { font-family: var(--font-display); font-size: clamp(2.5rem,7vw,4.5rem); font-weight: 900; letter-spacing: .15em; margin-bottom: 16px; opacity: 0; animation: fadeUp 1s ease .3s forwards; }
        .hero-sub-en { font-family: var(--font-en); font-size: clamp(.9rem,2vw,1.1rem); color: var(--accent-dim); letter-spacing: .2em; margin-bottom: 12px; opacity: 0; animation: fadeUp 1s ease .5s forwards; }
        .hero-content > p { font-size: clamp(.95rem,2.5vw,1.15rem); color: var(--text-muted); margin-bottom: 48px; opacity: 0; animation: fadeUp 1s ease .7s forwards; }
        .hero-cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; opacity: 0; animation: fadeUp 1s ease .9s forwards; }
        .hero-card { padding: 14px 32px; border: 1px solid var(--border); color: var(--text-muted); text-decoration: none; font-family: var(--font-display); font-size: .88rem; letter-spacing: .08em; transition: border-color .3s, color .3s, background .3s; }
        .hero-card:hover { border-color: var(--accent); color: var(--accent); background: rgba(201,162,77,.05); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

        /* ═══ SHARED ═══ */
        .section { padding: 80px 0; }
        .section-title { font-family: var(--font-display); font-size: clamp(1.6rem,4vw,2.2rem); font-weight: 700; text-align: center; margin-bottom: 12px; }
        .section-subtitle { text-align: center; color: var(--text-muted); font-size: .9rem; margin-bottom: 40px; }
        .divider { width: 40px; height: 2px; background: var(--accent); margin: 0 auto 40px; }
        .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s, transform .7s; }
        .reveal.in-view { opacity: 1; transform: translateY(0); }
        .cast-btn { padding: 14px 56px; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-family: var(--font-display); font-size: 1rem; letter-spacing: .18em; cursor: pointer; transition: background .4s, color .4s, letter-spacing .4s, transform .2s; }
        .cast-btn:hover { background: var(--accent); color: var(--bg); letter-spacing: .28em; }
        .cast-btn:active { transform: scale(.97); }
        .cast-btn:disabled { opacity: .35; cursor: not-allowed; }
        .cast-btn:disabled:hover { background: transparent; color: var(--accent); letter-spacing: .18em; }
        .loading { display: none; flex-direction: column; align-items: center; gap: 16px; padding: 40px 0; }
        .loading.show { display: flex; }
        .loading-spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: .85rem; color: var(--text-muted); font-family: var(--font-display); letter-spacing: .06em; }

        /* ═══ CONFIG ═══ */
        .config-card { max-width: 560px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); padding: 32px; }
        .config-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .config-header h3 { font-family: var(--font-display); font-size: 1.05rem; }
        .config-status { font-size: .75rem; padding: 3px 10px; border-radius: 2px; }
        .status-ok { background: rgba(74,158,110,.15); color: var(--green); border: 1px solid rgba(74,158,110,.3); }
        .status-none { background: rgba(110,103,96,.15); color: var(--text-muted); border: 1px solid rgba(110,103,96,.3); }
        .key-row { display: flex; gap: 10px; }
        .key-input { flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; font-size: .92rem; font-family: var(--font-body); outline: none; transition: border-color .3s; }
        .key-input:focus { border-color: var(--accent-dim); }
        .key-input::placeholder { color: var(--text-muted); }
        .key-btn { padding: 12px 20px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-family: var(--font-display); font-size: .85rem; letter-spacing: .06em; cursor: pointer; transition: background .3s, color .3s; white-space: nowrap; }
        .key-btn:hover { background: var(--accent); color: var(--bg); }
        .key-btn.sm { padding: 8px 14px; font-size: .78rem; }
        .key-btn.danger { border-color: var(--red); color: var(--red); }
        .key-btn.danger:hover { background: var(--red); color: var(--text); }
        .config-tip { margin-top: 14px; font-size: .76rem; color: var(--text-muted); line-height: 1.6; }
        .config-tip a { color: var(--accent-dim); text-decoration: none; }

        /* ═══ TABS ═══ */
        .module-tabs { display: flex; justify-content: center; gap: 4px; margin-bottom: 0; flex-wrap: wrap; }
        .module-tab { padding: 12px 28px; background: transparent; border: 1px solid var(--border); border-bottom: none; color: var(--text-muted); font-family: var(--font-display); font-size: .88rem; letter-spacing: .06em; cursor: pointer; transition: all .3s; position: relative; }
        .module-tab:hover { color: var(--text); }
        .module-tab.active { color: var(--accent); border-color: var(--accent-dim); background: var(--surface); }
        .module-tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: var(--surface); }
        .module-panel { display: none; }
        .module-panel.active { display: block; }

        /* ═══ LR: WHEEL & POSITIONS ═══ */
        .wheel-container { position: relative; width: 320px; height: 320px; margin: 0 auto 40px; }
        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 88px; height: 88px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: var(--accent); background: var(--surface); }
        .wheel-ring { position: absolute; inset: 0; border: 1px dashed var(--border); border-radius: 50%; opacity: .3; }
        .pos-node { position: absolute; width: 72px; text-align: center; top: 50%; left: 50%; margin-left: -36px; margin-top: -32px; cursor: pointer; transition: transform .3s, filter .3s; }
        .pos-node:hover { transform: translate(var(--tx),var(--ty)) scale(1.12)!important; filter: brightness(1.3); }
        .pos-node.active { filter: brightness(1.5) drop-shadow(0 0 12px var(--glow)); }
        .pos-node.active .pos-icon { animation: nodeGlow 1.5s ease-in-out infinite; }
        @keyframes nodeGlow { 0%,100% { box-shadow: 0 0 8px var(--glow); } 50% { box-shadow: 0 0 24px var(--glow), 0 0 48px var(--glow); } }
        .pos-icon { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-size: 1rem; font-family: var(--font-display); font-weight: 700; background: var(--surface); transition: border-color .3s, box-shadow .3s; }
        .pos-label { font-size: .7rem; color: var(--text-muted); font-family: var(--font-display); }
        .pos-element { font-size: .58rem; color: var(--text-muted); opacity: .5; }
        .pos-legend { display: grid; grid-template-columns: repeat(6,1fr); gap: 6px; max-width: 560px; margin: 0 auto 40px; }
        .pos-legend-item { display: flex; align-items: center; gap: 5px; padding: 6px 8px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; transition: border-color .3s; }
        .pos-legend-item.active { border-color: var(--accent-dim); }
        .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .legend-name { font-size: .68rem; font-family: var(--font-display); color: var(--text-muted); }
        .cast-section { text-align: center; margin-bottom: 36px; }

        /* LR Results */
        .lr-results { display: none; animation: fadeUp .6s ease; }
        .lr-results.show { display: block; }
        .lr-time { text-align: center; font-family: var(--font-en); font-size: .95rem; color: var(--accent-dim); letter-spacing: .06em; margin-bottom: 28px; }
        .lr-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 28px; }
        .lr-card { background: var(--surface); border: 1px solid var(--border); padding: 22px; text-align: center; opacity: 0; transform: translateY(16px); transition: opacity .5s, transform .5s, border-color .3s; }
        .lr-card.visible { opacity: 1; transform: translateY(0); }
        .lr-card:nth-child(2).visible { transition-delay: .15s; }
        .lr-card:nth-child(3).visible { transition-delay: .3s; }
        .lr-card:hover { border-color: var(--accent-dim); }
        .lr-card-title { font-size: .72rem; color: var(--text-muted); letter-spacing: .15em; margin-bottom: 10px; text-transform: uppercase; }
        .lr-card-pos { font-family: var(--font-display); font-size: 1.6rem; font-weight: 900; margin-bottom: 4px; }
        .lr-card-element { font-size: .78rem; color: var(--text-muted); margin-bottom: 10px; }
        .lr-card-fortune { display: inline-block; padding: 2px 10px; font-size: .72rem; border-radius: 2px; }
        .fortune-吉 { background: rgba(74,158,110,.12); color: var(--green); border: 1px solid rgba(74,158,110,.3); }
        .fortune-凶 { background: rgba(184,64,56,.12); color: #d06050; border: 1px solid rgba(184,64,56,.3); }
        .fortune-中 { background: rgba(201,162,77,.12); color: var(--accent); border: 1px solid rgba(201,162,77,.3); }
        .lr-card-text { margin-top: 10px; font-size: .78rem; color: var(--text-muted); line-height: 1.7; text-align: left; }
        .hourmsg-card { background: var(--surface); border: 1px solid var(--border); padding: 28px; opacity: 0; transform: translateY(16px); transition: opacity .5s, transform .5s; }
        .hourmsg-card.visible { opacity: 1; transform: translateY(0); }
        .hourmsg-title { font-family: var(--font-display); font-size: 1rem; color: var(--accent); margin-bottom: 14px; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
        .hourmsg-title::before { content: ''; width: 3px; height: 16px; background: var(--accent); display: block; }
        .hourmsg-body { font-size: .88rem; line-height: 2; color: var(--text); }
        .retry-section { text-align: center; margin-top: 28px; }
        .retry-btn { padding: 10px 36px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-family: var(--font-display); font-size: .88rem; letter-spacing: .06em; cursor: pointer; transition: border-color .3s, color .3s; }
        .retry-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ═══ BAZI ═══ */
        .bazi-form { max-width: 600px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); padding: 36px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: .78rem; color: var(--text-muted); letter-spacing: .04em; }
        .form-group input, .form-group select { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; font-size: .92rem; font-family: var(--font-body); outline: none; transition: border-color .3s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent-dim); }
        .form-group select option { background: var(--surface); }
        .form-actions { display: flex; gap: 12px; margin-top: 20px; }
        .form-actions .cast-btn { flex: 1; }
        .form-note { margin-top: 14px; font-size: .72rem; color: var(--text-muted); text-align: center; }
        .bazi-results { display: none; animation: fadeUp .6s ease; }
        .bazi-results.show { display: block; }
        .pillar-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
        .pillar { background: var(--surface); border: 1px solid var(--border); padding: 20px 12px; text-align: center; transition: border-color .3s; }
        .pillar:hover { border-color: var(--accent-dim); }
        .pillar-label { font-size: .7rem; color: var(--text-muted); letter-spacing: .12em; margin-bottom: 10px; text-transform: uppercase; }
        .pillar-stem { font-family: var(--font-display); font-size: 2rem; font-weight: 900; line-height: 1; color: var(--accent); }
        .pillar-branch { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; line-height: 1; color: var(--text); margin: 6px 0 4px; }
        .pillar-element { font-size: .72rem; color: var(--text-muted); margin-bottom: 6px; }
        .pillar-hidden { font-size: .7rem; color: var(--accent-dim); opacity: .7; line-height: 1.5; }
        .pillar-god { font-size: .7rem; color: var(--text-muted); margin-top: 4px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 10px; margin-bottom: 24px; }
        .info-item { background: var(--surface); border: 1px solid var(--border); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
        .info-item-label { font-size: .68rem; color: var(--text-muted); letter-spacing: .08em; }
        .info-item-value { font-family: var(--font-display); font-size: .95rem; color: var(--text); font-weight: 700; }
        .dayun-title { font-family: var(--font-display); font-size: 1.1rem; color: var(--accent); margin: 32px 0 16px; padding-left: 12px; border-left: 3px solid var(--accent); letter-spacing: .06em; }
        .dayun-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(90px,1fr)); gap: 8px; margin-bottom: 24px; }
        .dayun-card { background: var(--surface); border: 1px solid var(--border); padding: 12px 8px; text-align: center; transition: border-color .3s; }
        .dayun-card:hover { border-color: var(--accent-dim); }
        .dayun-card.active { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
        .dayun-age { font-size: .68rem; color: var(--text-muted); margin-bottom: 4px; }
        .dayun-stems { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--accent); line-height: 1.3; }
        .dayun-branch { font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.3; }
        .dayun-12cs { font-size: .65rem; color: var(--accent-dim); margin-top: 4px; }
        .qiyun-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; margin-bottom: 24px; }
        .qiyun-card h4 { font-family: var(--font-display); font-size: .9rem; color: var(--accent); margin-bottom: 10px; letter-spacing: .06em; }
        .qiyun-card p { font-size: .85rem; color: var(--text); line-height: 1.8; }
        .ln-title { font-family: var(--font-display); font-size: 1rem; color: var(--text); margin: 20px 0 12px; letter-spacing: .04em; }
        .ln-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
        .ln-scroll::-webkit-scrollbar { height: 4px; }
        .ln-scroll::-webkit-scrollbar-track { background: var(--surface); }
        .ln-scroll::-webkit-scrollbar-thumb { background: var(--accent-dim); }
        .ln-card { min-width: 56px; background: var(--surface-2); border: 1px solid var(--border); padding: 8px 6px; text-align: center; flex-shrink: 0; }
        .ln-year { font-size: .6rem; color: var(--text-muted); margin-bottom: 2px; }
        .ln-stem { font-family: var(--font-display); font-size: .88rem; font-weight: 700; color: var(--accent); }
        .ln-age { font-size: .58rem; color: var(--text-muted); }

        /* ═══ LENORMAND ═══ */
        .lnm-options { display: flex; justify-content: center; gap: 10px; margin-bottom: 32px; flex-wrap: wrap; }
        .lnm-opt { padding: 10px 22px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); font-family: var(--font-display); font-size: .88rem; letter-spacing: .04em; cursor: pointer; transition: all .3s; }
        .lnm-opt:hover { border-color: var(--accent-dim); color: var(--text); }
        .lnm-opt.active { border-color: var(--accent); color: var(--accent); background: rgba(201,162,77,.06); }
        .lnm-cast-section { text-align: center; margin-bottom: 40px; }

        /* Card fan display */
        .lnm-fan { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-bottom: 32px; perspective: 800px; }
        .lnm-card { width: 110px; height: 170px; position: relative; cursor: default; perspective: 600px; opacity: 0; transform: translateY(30px) rotateY(90deg); transition: opacity .5s, transform .6s; }
        .lnm-card.visible { opacity: 1; transform: translateY(0) rotateY(0); }
        .lnm-card-inner { width: 100%; height: 100%; position: relative; transition: transform .8s cubic-bezier(.4,0,.2,1); transform-style: preserve-3d; }
        .lnm-card.flipped .lnm-card-inner { transform: rotateY(180deg); }
        .lnm-card-front, .lnm-card-back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 8px; }
        .lnm-card-front { background: linear-gradient(145deg, #1e1e30, #12121e); border: 1px solid var(--accent-dim); }
        .lnm-card-front-pattern { position: absolute; inset: 8px; border: 1px solid rgba(201,162,77,.15); border-radius: 4px; }
        .lnm-card-front .card-back-symbol { font-size: 2.2rem; color: var(--accent); opacity: .4; }
        .lnm-card-front .card-back-text { font-size: .55rem; color: var(--accent-dim); opacity: .3; margin-top: 4px; font-family: var(--font-display); letter-spacing: .1em; }
        .lnm-card-back { background: linear-gradient(145deg, #1a1a2a, #10101a); border: 1px solid var(--border); transform: rotateY(180deg); text-align: center; }
        .lnm-card-idx { position: absolute; top: 6px; left: 8px; font-size: .6rem; color: var(--accent-dim); font-family: var(--font-en); }
        .lnm-card-icon { font-size: 2.8rem; margin-bottom: 6px; line-height: 1; }
        .lnm-card-name { font-family: var(--font-display); font-size: .92rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
        .lnm-card-keywords { font-size: .62rem; color: var(--text-muted); line-height: 1.4; }

        /* LNM result text */
        .lnm-result-box { display: none; max-width: 680px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); padding: 32px; animation: fadeUp .5s ease; }
        .lnm-result-box.show { display: block; }
        .lnm-result-time { font-family: var(--font-en); font-size: .88rem; color: var(--accent-dim); margin-bottom: 20px; text-align: center; letter-spacing: .06em; }
        .lnm-result-data { font-size: .92rem; color: var(--text); line-height: 2; }
        .lnm-result-data p { margin-bottom: 12px; }
        .lnm-result-data strong { color: var(--accent); }

        /* ═══ FOOTER ═══ */
        .footer { padding: 40px 24px; text-align: center; border-top: 1px solid var(--border); }
        .footer-logo { font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; letter-spacing: .06em; }
        .footer p { font-size: .75rem; color: var(--text-muted); line-height: 1.6; }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .nav-toggle { display: flex; }
            .hero-symbol { font-size: 4rem; }
            .hero-cards { flex-direction: column; align-items: center; }
            .hero-card { width: 220px; text-align: center; }
            .wheel-container { width: 260px; height: 260px; }
            .wheel-center { width: 70px; height: 70px; font-size: 1.3rem; }
            .pos-icon { width: 36px; height: 36px; font-size: .85rem; }
            .pos-node { width: 56px; margin-left: -28px; }
            .pos-legend { grid-template-columns: repeat(3,1fr); }
            .lr-cards { grid-template-columns: 1fr; }
            .pillar-row { grid-template-columns: repeat(2,1fr); }
            .form-grid { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column; }
            .dayun-grid { grid-template-columns: repeat(auto-fill,minmax(75px,1fr)); }
            .module-tab { padding: 10px 18px; font-size: .8rem; }
            .config-card, .bazi-form { padding: 20px; }
            .key-row { flex-direction: column; }
            .lnm-card { width: 90px; height: 140px; }
            .lnm-card-icon { font-size: 2rem; }
            .lnm-card-name { font-size: .78rem; }
            .lnm-card-keywords { font-size: .55rem; }
        }
        @media (max-width: 480px) {
            .wheel-container { width: 220px; height: 220px; }
            .pos-legend { grid-template-columns: repeat(2,1fr); }
            .lnm-card { width: 80px; height: 125px; }
            .lnm-fan { gap: 8px; }
        }
    </style>
</head>

</nav>

<!-- ═══ HERO ═══ -->
<section class="hero">
    <div class="hero-content">

        <div class="hero-sub-en">YIDAO · CHINESE DIVINATION</div>

</section>

<!-- ═══ MODULES ═══ -->
<section class="section" id="modules" style="background:var(--surface);">
    <div class="container">
        <div class="module-tabs reveal">
            <button class="module-tab active" data-tab="lr" onclick="switchTab('lr')">小六壬神课</button>
            <button class="module-tab" data-tab="bz" onclick="switchTab('bz')">八字排盘</button>
            <button class="module-tab" data-tab="lnm" onclick="switchTab('lnm')">雷诺曼占卜</button>
        </div>

        <!-- ════════════ LR PANEL ════════════ -->
        <div class="module-panel active" id="panel-lr" style="background:var(--bg);border:1px solid var(--border);border-top:none;padding:40px 24px;">
            <div class="section-title" style="margin-top:0">小六壬 · 起卦</div>
            <div class="section-subtitle">心中默念所问之事，按下方按钮依时起卦</div>
            <div class="divider"></div>
            <div class="wheel-container" id="wheelContainer"><div class="wheel-ring"></div><div class="wheel-center">☰</div></div>
            <div class="pos-legend" id="posLegend"></div>
            <div class="cast-section"><button class="cast-btn" id="lrCastBtn" onclick="castLR()">起 卦</button></div>
            <div class="loading" id="lrLoading"><div class="loading-spinner"></div><span class="loading-text">掐指推算中…</span></div>
            <div class="lr-results" id="lrResults">
                <div class="lr-time" id="lrTime"></div>
                <div class="lr-cards" id="lrCards"></div>
                <div class="hourmsg-card" id="hourmsgCard"><div class="hourmsg-title">时辰注解</div><div class="hourmsg-body" id="hourmsgBody"></div></div>
                <div class="retry-section"><button class="retry-btn" onclick="castLR()">重新起卦</button></div>
            </div>
        </div>

        <!-- ════════════ BZ PANEL ════════════ -->
        <div class="module-panel" id="panel-bz" style="background:var(--bg);border:1px solid var(--border);border-top:none;padding:40px 24px;">
            <div class="section-title" style="margin-top:0">八字排盘</div>
            <div class="section-subtitle">输入出生信息，自动排出四柱八字与大运流年</div>
            <div class="divider"></div>
            <div class="bazi-form">
                <div class="form-grid">
                    <div class="form-group"><label>出生年份</label><input type="number" id="bzYear" placeholder="如 1990" min="1900" max="2100"></div>
                    <div class="form-group"><label>出生月份</label>
                        <select id="bzMonth"><option value="">选择月份</option><option value="1">1月</option><option value="2">2月</option><option value="3">3月</option><option value="4">4月</option><option value="5">5月</option><option value="6">6月</option><option value="7">7月</option><option value="8">8月</option><option value="9">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option></select>
                    </div>
                    <div class="form-group"><label>出生日期</label><input type="number" id="bzDay" placeholder="如 15" min="1" max="31"></div>
                    <div class="form-group"><label>出生时辰（小时）</label>
                        <select id="bzHour"><option value="">选择时辰</option><option value="00">子时 23:00-01:00</option><option value="01">丑时 01:00-03:00</option><option value="03">寅时 03:00-05:00</option><option value="05">卯时 05:00-07:00</option><option value="07">辰时 07:00-09:00</option><option value="09">巳时 09:00-11:00</option><option value="11">午时 11:00-13:00</option><option value="13">未时 13:00-15:00</option><option value="15">申时 15:00-17:00</option><option value="17">酉时 17:00-19:00</option><option value="19">戌时 19:00-21:00</option><option value="21">亥时 21:00-23:00</option></select>
                    </div>
                    <div class="form-group"><label>出生分钟</label><input type="number" id="bzMinute" placeholder="如 30" min="0" max="59"></div>
                    <div class="form-group"><label>性别</label>
                        <select id="bzGender"><option value="0">男（乾造）</option><option value="1">女（坤造）</option></select>
                    </div>
                </div>
                <div class="form-actions"><button class="cast-btn" id="bzCastBtn" onclick="castBZ()">排 盘</button></div>
                <div class="form-note">※ 精确排盘建议使用真太阳时校验</div>
            </div>
            <div class="loading" id="bzLoading"><div class="loading-spinner"></div><span class="loading-text">排盘计算中…</span></div>
            <div class="bazi-results" id="bzResults"></div>
        </div>

        <!-- ════════════ LNM PANEL ════════════ -->
        <div class="module-panel" id="panel-lnm" style="background:var(--bg);border:1px solid var(--border);border-top:none;padding:40px 24px;">
            <div class="section-title" style="margin-top:0">雷诺曼 · 占卜</div>
            <div class="section-subtitle">选择牌阵，点击抽牌，翻转查看命运指引</div>
            <div class="divider"></div>

            <div class="lnm-options" id="lnmOptions">
                <button class="lnm-opt" data-type="1" onclick="setLnmType(1)">单牌</button>
                <button class="lnm-opt" data-type="3" onclick="setLnmType(3)">三牌</button>
                <button class="lnm-opt active" data-type="5" onclick="setLnmType(5)">五牌</button>
                <button class="lnm-opt" data-type="7" onclick="setLnmType(7)">七牌</button>
                <button class="lnm-opt" data-type="9" onclick="setLnmType(9)">九牌</button>
            </div>

            <div class="lnm-cast-section">
                <button class="cast-btn" id="lnmCastBtn" onclick="castLNM()">抽 牌</button>
            </div>

            <div class="loading" id="lnmLoading"><div class="loading-spinner"></div><span class="loading-text">命运之牌翻开中…</span></div>

            <div class="lnm-fan" id="lnmFan"></div>

            <div class="lnm-result-box" id="lnmResultBox">
                <div class="lnm-result-time" id="lnmResultTime"></div>
                <div class="lnm-result-data" id="lnmResultData"></div>
                <div class="retry-section" style="margin-top:24px;">
                    <button class="retry-btn" onclick="castLNM()">重新抽牌</button>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- ═══ FOOTER ═══ -->
<footer class="footer">
    <div class="footer-logo">易道 · YiDao</div>
    <p>传统文化仅供学习参考，不作为决策依据<br>数据来源：t1qq.com 免费易学 API</p>
</footer>

<script>
// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let apiKey = window.API_KEY || '';
let lnmType = 5;

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
    buildWheel(); buildLegend(); updateKeyUI();
    if (apiKey) document.getElementById('keyInput').value = apiKey;
    window.addEventListener('scroll', () => document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 40));
    new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in-view'); }), { threshold: 0.1 })
        .observe && document.querySelectorAll('.reveal').forEach(el => {
        new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in-view'); }), { threshold: 0.1 }).observe(el);
    });
});

function closeMob() { document.getElementById('mobileMenu').classList.remove('open'); }

// ═══════════════════════════════════════
//  TABS
// ═══════════════════════════════════════
function switchTab(tab) {
    document.querySelectorAll('.module-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.querySelectorAll('.module-panel').forEach(p => p.classList.toggle('active', p.id === `panel-${tab}`));
}

// ═══════════════════════════════════════
//  API KEY
// ═══════════════════════════════════════
function toggleVis() { const i = document.getElementById('keyInput'); i.type = i.type === 'password' ? 'text' : 'password'; }
function needKey() { if (!apiKey) { alert('请在 config.js 中填写 API Key'); return true; } return false; }
// ═══════════════════════════════════════
//  LR: POSITIONS & WHEEL
// ═══════════════════════════════════════
const POSITIONS = [
    { name:'大安', color:'#4a9e6e', element:'木', dir:'东方', spirit:'青龙', fortune:'吉', brief:'身不动时，凡事安稳，所求皆遂。' },
    { name:'留连', color:'#8b7355', element:'土', dir:'中央', spirit:'玄武', fortune:'凶', brief:'卜者逢之，事情拖延，暗昧不明。' },
    { name:'速喜', color:'#c94040', element:'火', dir:'南方', spirit:'朱雀', fortune:'吉', brief:'喜即至，求财向南，有好消息。' },
    { name:'赤口', color:'#b0b0b0', element:'金', dir:'西方', spirit:'白虎', fortune:'凶', brief:'口舌多，多争吵，宜守不宜动。' },
    { name:'小吉', color:'#4a80b4', element:'水', dir:'北方', spirit:'六合', fortune:'吉', brief:'最吉昌，诸事可为，贵人相助。' },
    { name:'空亡', color:'#5a5a5a', element:'土', dir:'中央', spirit:'勾陈', fortune:'凶', brief:'事不详，求财无益，暗中多阻。' }
];

function buildWheel() {
    const c = document.getElementById('wheelContainer');
    POSITIONS.forEach((pos, i) => {
        const a = (i * 60 - 90) * Math.PI / 180, r = 120;
        const x = Math.cos(a) * r, y = Math.sin(a) * r;
        const n = document.createElement('div');
        n.className = 'pos-node'; n.id = `node-${i}`;
        n.style.cssText = `--tx:${x}px;--ty:${y}px;--glow:${pos.color};transform:translate(${x}px,${y}px)`;
        n.innerHTML = `<div class="pos-icon" style="border-color:${pos.color};color:${pos.color}">${pos.name[0]}</div><div class="pos-label">${pos.name}</div><div class="pos-element">${pos.element} · ${pos.fortune}</div>`;
        n.onclick = () => alert(`${pos.name}\n五行：${pos.element}  方位：${pos.dir}\n神煞：${pos.spirit}  吉凶：${pos.fortune}\n\n${pos.brief}`);
        c.appendChild(n);
    });
}
function buildLegend() {
    const l = document.getElementById('posLegend');
    POSITIONS.forEach((pos, i) => {
        const d = document.createElement('div');
        d.className = 'pos-legend-item'; d.id = `legend-${i}`;
        d.innerHTML = `<span class="legend-dot" style="background:${pos.color}"></span><span class="legend-name">${pos.name} · ${pos.spirit}</span>`;
        l.appendChild(d);
    });
}
function clearHL() { POSITIONS.forEach((_, i) => { document.getElementById(`node-${i}`).classList.remove('active'); document.getElementById(`legend-${i}`).classList.remove('active'); }); }
function findPosIdx(t) { if (!t) return -1; for (let i = 0; i < POSITIONS.length; i++) if (t.includes(POSITIONS[i].name)) return i; return -1; }

// ═══════════════════════════════════════
//  LR: CAST
// ═══════════════════════════════════════
async function castLR() {
    if (needKey()) return;
    const btn = document.getElementById('lrCastBtn'); btn.disabled = true;
    document.getElementById('lrResults').classList.remove('show');
    document.getElementById('lrLoading').classList.add('show'); clearHL();
    try {
        const res = await fetch(`/.netlify/functions/lr-proxy?key=${encodeURIComponent(apiKey)}`);
        const data = await res.json();
        if (data.code !== 200) throw new Error(data.error || `接口异常 code: ${data.code}`);
        displayLR(data);
    } catch (e) { alert('起卦失败：' + e.message); }
    finally { document.getElementById('lrLoading').classList.remove('show'); btn.disabled = false; }
}

function displayLR(data) {
    document.getElementById('lrTime').textContent = data.time || new Date().toLocaleString('zh-CN');
    const cardsEl = document.getElementById('lrCards'); cardsEl.innerHTML = '';
    const cls = [{ label:'月课', value: data.res?.monthclass }, { label:'日课', value: data.res?.dayclass }, { label:'时课', value: data.res?.nowclass }];
    const active = new Set();
    cls.forEach((c, ci) => {
        const idx = findPosIdx(c.value); if (idx >= 0) active.add(idx);
        const pos = idx >= 0 ? POSITIONS[idx] : null;
        const card = document.createElement('div'); card.className = 'lr-card';
        let h = `<div class="lr-card-title">${c.label}</div>`;
        if (pos) { h += `<div class="lr-card-pos" style="color:${pos.color}">${pos.name}</div><div class="lr-card-element">${pos.element} · ${pos.spirit} · ${pos.dir}</div><span class="lr-card-fortune fortune-${pos.fortune}">${pos.fortune}</span><div class="lr-card-text">${pos.brief}</div>`; }
        else { h += `<div class="lr-card-pos">${c.value || '—'}</div>`; }
        card.innerHTML = h; cardsEl.appendChild(card);
        requestAnimationFrame(() => setTimeout(() => card.classList.add('visible'), ci * 150));
    });
    active.forEach(i => { document.getElementById(`node-${i}`).classList.add('active'); document.getElementById(`legend-${i}`).classList.add('active'); });
    const hmCard = document.getElementById('hourmsgCard'), hmBody = document.getElementById('hourmsgBody');
    if (data.hourmsg) { hmBody.innerHTML = `<p>${data.hourmsg.replace(/。/g, '。<br>').replace(/！/g, '！<br>').replace(/<br>$/, '')}</p>`; hmCard.style.display = 'block'; setTimeout(() => hmCard.classList.add('visible'), 400); }
    else { hmCard.style.display = 'none'; }
    document.getElementById('lrResults').classList.add('show');
    setTimeout(() => document.getElementById('lrResults').scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
}

// ═══════════════════════════════════════
//  BZ: CAST
// ═══════════════════════════════════════
async function castBZ() {
    if (needKey()) return;
    const year = document.getElementById('bzYear').value, month = document.getElementById('bzMonth').value, day = document.getElementById('bzDay').value, hour = document.getElementById('bzHour').value, minute = document.getElementById('bzMinute').value || '0', gender = document.getElementById('bzGender').value;
    if (!year || !month || !day || hour === '') { alert('请填写完整的出生信息'); return; }
    const btn = document.getElementById('bzCastBtn'); btn.disabled = true;
    document.getElementById('bzResults').classList.remove('show'); document.getElementById('bzLoading').classList.add('show');
    try {
        const qs = new URLSearchParams({ key: apiKey, x: gender, y: year, m: month, d: day, h: hour, i: minute, s: '0' });
        const res = await fetch(`/.netlify/functions/bz-proxy?${qs}`);
        const data = await res.json();
        if (data.code !== 200) throw new Error(data.msg || `接口异常 code: ${data.code}`);
        displayBZ(data);
    } catch (e) { alert('排盘失败：' + e.message); }
    finally { document.getElementById('bzLoading').classList.remove('show'); btn.disabled = false; }
}

function displayBZ(data) {
    const d = data.data, el = document.getElementById('bzResults');
    let html = '';
    // Info grid
    html += `<div class="info-grid">`;
    const infoItems = [
        { label:'命造', value: d.mz || '—' }, { label:'性别', value: d.xb || '—' }, { label:'生肖', value: d.sx || '—' }, { label:'星座', value: d.xz || '—' },
        { label:'公历', value: (Array.isArray(d.gl) ? d.gl.join(' ') : (d.gl || '—')) },
        { label:'农历', value: (typeof d.nl === 'object' && d.nl?.gz ? d.nl.gz : (Array.isArray(d.nl) ? d.nl.join(' ') : (d.nl || '—'))) },
        { label:'日干阴阳', value: d.cyy || '—' }, { label:'起运', value: d.qyy_desc || '—' }
    ];
    infoItems.forEach(it => { html += `<div class="info-item"><span class="info-item-label">${it.label}</span><span class="info-item-value">${it.value}</span></div>`; });
    html += `</div>`;
    // Pillars
    const ctg = Array.isArray(d.ctg) ? d.ctg : [], cdz = Array.isArray(d.cdz) ? d.cdz : [], ewxtg = Array.isArray(d.ewxtg) ? d.ewxtg : [], ewxdz = Array.isArray(d.ewxdz) ? d.ewxdz : [];
    const labels = ['年柱','月柱','日柱','时柱'];
    const branchOrder = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const branchToIdx = {}; branchOrder.forEach((b, i) => branchToIdx[b] = i);
    const bctg = Array.isArray(d.bctg) ? d.bctg : [], bzcg = Array.isArray(d.bzcg) ? d.bzcg : [];
    html += `<div class="pillar-row">`;
    for (let i = 0; i < 4; i++) {
        const stem = ctg[i] || '—', branch = cdz[i] || '—';
        const bi = branchToIdx[branch];
        const hStems = []; if (bi !== undefined) { const h = bctg[bi]; if (h && h !== '') hStems.push(h); }
        const tenGod = (i === 2) ? '日主' : (bi !== undefined ? (bzcg[bi] || '') : '');
        html += `<div class="pillar"><div class="pillar-label">${labels[i]}</div><div class="pillar-stem">${stem}</div><div class="pillar-branch">${branch}</div><div class="pillar-element">${ewxtg[i] || ''} · ${ewxdz[i] || ''}</div>${hStems.length ? `<div class="pillar-hidden">藏：${hStems.join(' ')}</div>` : ''}${tenGod ? `<div class="pillar-god">${tenGod}</div>` : ''}</div>`;
    }
    html += `</div>`;
    // QiYun
    if (d.qyy_desc || d.qyy) { html += `<div class="qiyun-card"><h4>起运信息</h4><p>${d.qyy_desc || ''}</p>${d.qyy ? `<p>起运公历：<strong>${d.qyy}</strong> 年</p>` : ''}</div>`; }
    // DaYun
    const dy = Array.isArray(d.dy) ? d.dy : [];
    if (dy.length) {
        html += `<div class="dayun-title">大运排布</div><div class="dayun-grid">`;
        dy.forEach((yun, yi) => {
            html += `<div class="dayun-card ${yi === 0 ? 'active' : ''}"><div class="dayun-age">${yun.zqage || ''}~${yun.zboz || ''}岁</div><div class="dayun-stems">${yun.zfma || '?'}</div><div class="dayun-branch">${yun.zfmb || '?'}</div>${yun.nzsc ? `<div class="dayun-12cs">${yun.nzsc}</div>` : ''}</div>`;
        });
        html += `</div>`;
        // LiuNian for first DaYun
        dy.forEach(yun => {
            const ly = Array.isArray(yun.ly) ? yun.ly : [];
            if (ly.length) {
                html += `<div class="ln-title">${yun.zfma || ''}${yun.zfmb || ''}运 · 流年（${yun.zqage || ''}~${yun.zboz || ''}岁）</div><div class="ln-scroll">`;
                ly.forEach(ln => { html += `<div class="ln-card"><div class="ln-year">${ln.year || ''}</div><div class="ln-stem">${ln.lye || ''}</div><div class="ln-age">${ln.age || ''}岁</div></div>`; });
                html += `</div>`;
            }
        });
    }
    el.innerHTML = html; el.classList.add('show');
    setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
}

// ═══════════════════════════════════════
//  LNM: LENORMAND
// ═══════════════════════════════════════
// Lenormand card name/icon lookup (36 cards)
const LNM_CARDS = {
    '骑手': '🏇', '三叶草': '🍀', '船': '⛵', '房子': '🏠', '树': '🌳',
    '云': '☁️', '蛇': '🐍', '棺材': '⚰️', '花束': '💐', '镰刀': '🔪',
    '鞭子': '🪶', '鸟': '🐦', '孩子': '👶', '狐狸': '🦊', '熊': '🐻',
    '星星': '⭐', '鹳': '🦅', '狗': '🐕', '塔': '🗼', '花园': '🌿',
    '山': '⛰️', '十字路口': '🛤️', '老鼠': '🐭', '心': '❤️', '戒指': '💍',
    '书': '📖', '信件': '✉️', '男人': '👨', '女人': '👩', '百合': '🌺',
    '太阳': '☀️', '月亮': '🌙', '钥匙': '🔑', '鱼': '🐟', '锚': '⚓',
    '十字架': '✝️'
};

function getCardIcon(name) {
    if (!name) return '🃏';
    for (const [k, v] of Object.entries(LNM_CARDS)) { if (name.includes(k)) return v; }
    return '🃏';
}

function setLnmType(type) {
    lnmType = type;
    document.querySelectorAll('.lnm-opt').forEach(b => b.classList.toggle('active', parseInt(b.dataset.type) === type));
}

async function castLNM() {
    if (needKey()) return;
    const btn = document.getElementById('lnmCastBtn'); btn.disabled = true;
    document.getElementById('lnmResultBox').classList.remove('show');
    document.getElementById('lnmFan').innerHTML = '';
    document.getElementById('lnmLoading').classList.add('show');

    try {
        const qs = new URLSearchParams({ key: apiKey, type: String(lnmType) });
        const res = await fetch(`/.netlify/functions/lnm-proxy?${qs}`);
        const data = await res.json();
        if (data.code !== 200) throw new Error(data.msg || data.error || `接口异常 code: ${data.code}`);
        displayLNM(data);
    } catch (e) { alert('抽牌失败：' + e.message); }
    finally { document.getElementById('lnmLoading').classList.remove('show'); btn.disabled = false; }
}

function displayLNM(data) {
    const fan = document.getElementById('lnmFan');
    fan.innerHTML = '';

    // Parse card data — API returns card names in data field
    // data.data might be a string like "心,钥匙,太阳,月亮,星星" or could be structured
    let cards = [];
    const raw = data.data || '';

    if (typeof raw === 'string') {
        // Try comma / 、 / space / newline separated
        cards = raw.split(/[,，、\n\r]+/).map(s => s.trim()).filter(Boolean);
    } else if (Array.isArray(raw)) {
        cards = raw.map(c => typeof c === 'object' ? (c.name || c.title || JSON.stringify(c)) : String(c));
    }

    if (!cards.length && raw) cards = [String(raw)];

    // Create card elements
    cards.forEach((cardName, i) => {
        const card = document.createElement('div');
        card.className = 'lnm-card';
        card.style.transitionDelay = `${i * 0.12}s`;

        const icon = getCardIcon(cardName);

        card.innerHTML = `
            <div class="lnm-card-inner">
                <div class="lnm-card-front">
                    <div class="lnm-card-front-pattern"></div>
                    <span class="card-back-symbol">✦</span>
                    <span class="card-back-text">LENORMAND</span>
                </div>
                <div class="lnm-card-back">
                    <span class="lnm-card-idx">${i + 1}</span>
                    <div class="lnm-card-icon">${icon}</div>
                    <div class="lnm-card-name">${cardName}</div>
                </div>
            </div>
        `;

        fan.appendChild(card);

        // Stagger: appear → then flip
        requestAnimationFrame(() => {
            setTimeout(() => {
                card.classList.add('visible');
                setTimeout(() => card.classList.add('flipped'), 400 + i * 100);
            }, i * 150);
        });
    });

    // Show result text
    setTimeout(() => {
        const box = document.getElementById('lnmResultBox');
        const timeEl = document.getElementById('lnmResultTime');
        const dataEl = document.getElementById('lnmResultData');

        timeEl.textContent = data.time || new Date().toLocaleString('zh-CN');

        let html = '';
        if (cards.length) {
            html += `<p><strong>抽取牌面：</strong>${cards.map((c, i) => `<strong>${c}</strong>`).join('、')}</p>`;
        }
        // If API returns additional interpretation text
        if (data.msg && data.msg !== 'success') {
            html += `<p>${data.msg}</p>`;
        }
        if (!html) html = '<p>牌已翻开，请根据牌面进行解读。</p>';

        dataEl.innerHTML = html;
        box.classList.add('show');
        setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
    }, cards.length * 250 + 800);
}
